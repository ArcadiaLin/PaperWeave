[project]
name = "apply-patch"
version = "0.1.0"
description = "apply_patch / V4A diff（vendored from openai/openai-agents-python，只取解析与应用，不含 SDK 运行时）"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.14"
# 只用标准库：上游这几处代码本来就不依赖第三方包；SDK 运行时、沙箱与审批均未复制。
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apply_patch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
