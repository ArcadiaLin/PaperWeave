      methods under the look-back window used by prior Transformer work. Multivariate; MSE and MAE, lower
      is better. L=96, T in {96, 192, 336, 720}. Only DLinear-S (shared linear layer) is reported. FEDformer
      is FEDformer-f (line 146). Rows marked * (DLinear-S, Pyraformer) were run by the authors; the other
      rows are taken from the FEDformer paper (line 196). Data split: the long-term forecasting convention
      of prior Transformer work (Autoformer setting). Metrics: MSE, MAE.
    note: >-
      FEDformer MAE on ETTh2 at T=720 is printed as "0474" (decimal point missing, presumably 0.474).
    FROM:
    - to: $paper
      locators:
      - 5.1 Experimental Settings::174:196
      - 5.2 Comparison of Multivariate Forecasting with Transformers::203:203
    EVALUATES:
    - to: $dlinear
