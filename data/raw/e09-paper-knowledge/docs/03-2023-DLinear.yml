  # S5.T8：5.4 More Analyses on Transformer-Based Solutions，第 378–391 行
  $x_t8:
    kind: Experiment
    anchors: [S5.T8]
    text: >-
      Efficiency of DLinear and Transformer-based methods on Electricity: computation, parameters, inference
