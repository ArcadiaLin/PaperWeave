    - to: dataset_0006   # Electricity
      role: evaluation_data
    - to: dataset_0007   # Traffic
      role: evaluation_data
    ON_TASK: [task_0002]   # Long-term time series forecasting

  # S5.T7：5.4 More Analyses on Transformer-Based Solutions，第 362–373 行
  $x_t7:
    kind: Experiment
    anchors: [S5.T7]
    text: >-
      Effect of training data size: DLinear, FEDformer and Autoformer trained on the full Traffic training
      set versus a shortened one-year training set. Traffic; MSE only, lower is better. Rows are horizons
      T in {96, 192, 336, 720}. Ori. trains on the full training set (17,544*0.7 hours); Short trains on
      8,760 hours, i.e. one year (line 373). The look-back window is not stated. Metrics: MSE.
    note: >-
      The dataset is named only in the text (line 373), not in the table, whose header cell "Dataset" labels
      the horizon column. The Ori. values of DLinear, FEDformer and Autoformer equal their Traffic MSE in
