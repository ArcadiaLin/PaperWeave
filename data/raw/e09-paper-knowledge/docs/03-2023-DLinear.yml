  # S5.T6：5.4 More Analyses on Transformer-Based Solutions，第 345–360 行
  $x_t6:
    kind: Experiment
    anchors: [S5.T6]
    text: >-
      Effect of positional and timestamp embeddings on FEDformer, Autoformer and Informer for multivariate
      forecasting on Electricity and Traffic. Multivariate; MSE only, lower is better. L=96, T in {96, 192,
      336, 720}. Embedding labels as printed: All (all embeddings), wo/Pos. (without the fixed positional
      embedding), wo/Temp. (without the timestamp embedding), wo/Pos.-Temp. (without both). Data split:
      the long-term forecasting convention of prior Transformer work (Autoformer setting). Metrics: MSE.
    note: >-
      Split convention inferred from the statement at line 203, which is made for Tables 2 and 3. Several
      rows equal Table 2 entries taken from the FEDformer paper: FEDformer wo/Pos., Autoformer wo/Pos. on
      Traffic, and Informer All. Autoformer wo/Pos. on Electricity (0.193, 0.201, 0.214, 0.246) is identical
      to FEDformer wo/Pos., likely a copy error.
    FROM:
    - to: $paper
      locators:
      - 5.4 More Analyses on Transformer-Based Solutions::345:360
      - 5.2 Comparison of Multivariate Forecasting with Transformers::203:203
    EVALUATES:
    - to: $fedformer
      role: target
      description: >-
        Variants as printed: All, wo/Pos., wo/Temp., wo/Pos.-Temp.. The paper does not state where these
        results come from.
    - to: $autoformer
      role: target
      description: >-
        Variants as printed: All, wo/Pos., wo/Temp., wo/Pos.-Temp.. The paper does not state where these
        results come from.
    - to: $informer
      role: target
      description: >-
