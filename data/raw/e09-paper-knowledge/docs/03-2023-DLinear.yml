      source_refs: ['$paper::5.1 Experimental Settings::196:196']
    - to: $reformer
      role: baseline
      description: >-
        Results taken from "Fedformer: Frequency enhanced decomposed transformer for long-term series forecasting".
      source_refs: ['$paper::5.1 Experimental Settings::196:196']
    USES:
    - to: dataset_0002   # ETTh1
      role: evaluation_data
    - to: dataset_0003   # ETTh2
      role: evaluation_data
    - to: dataset_0004   # ETTm1
      role: evaluation_data
    - to: dataset_0005   # ETTm2
      role: evaluation_data
    ON_TASK: [task_0002]   # Long-term time series forecasting

  # S5.T4：5.3 Comparison under a Large Look-Back Window Size，第 251–290 行
  $x_t4:
    kind: Experiment
    anchors: [S5.T4]
    text: >-
      Multivariate long-term forecasting on nine benchmarks comparing DLinear with a long look-back window
      against FEDformer and Autoformer kept at their best setting. Multivariate; MSE and MAE, lower is better.
      Look-back window L=336 for DLinear; FEDformer and Autoformer keep L=96, their best setting. Forecasting
      horizon T in {96, 192, 336, 720}. Variant labels as printed: DLinear-S shares one linear layer across
      all variates (the paper's default); DLinear-I uses an individual linear layer per variate; FEDformer-f
      / FEDformer-w are FEDformer with Fourier / wavelet enhanced blocks. Data split: the long-term forecasting
      convention of prior Transformer work (Autoformer setting). Metrics: MSE, MAE.
    note: >-
      Split convention inferred from the statement at line 203, which is made for Tables 2 and 3. FEDformer-f
      and Autoformer values on the eight non-ILI datasets equal those of Tables 2 and 3 (taken from the
      FEDformer paper); the source of the FEDformer-w values is not stated. ILI rows are printed with horizons
      96-720, implausible for ILI (966 time steps) with L=336. The FEDformer-f and Autoformer values on
      ILI equal Table 2's ILI values at horizons 24-60, so the horizon labels are likely misprinted and
      those baseline values likely reused from Table 2.
    FROM:
    - to: $paper
      locators:
      - 5.3 Comparison under a Large Look-Back Window Size::251:290
      - 5.2 Comparison of Multivariate Forecasting with Transformers::203:203
    EVALUATES:
    - to: $dlinear
      role: target
      description: 'Variants as printed: DLinear-S, DLinear-I. Run by the authors of this paper.'
    - to: $fedformer
