# 论文 2023-DLinear：由 data/raw/e09-paper-knowledge/forms/2023-DLinear.yml（paper-form-v2，报告级）一次性转换（2026-10-05）。
# 转换规则：表单的 setting、切分约定与指标并入实验的 text（模型中没有 Metric 与条件字段）；切分依据的行加入 FROM 的 locators；
# 参与方的变体与结果来源（own / rerun / cited / unstated）写进 EVALUATES 边的 description，依据行写进 source_refs；
# 原文的笔误印法写进 USES 边的 description。已有对象按名称在库中解析为 id；查重判断见 confirm。

graph-doc: v0.1
by: claude
confirm:
  $dlinear:
    distinct_from: [method_0008, method_0007, method_0002, method_0004, method_0010]
  $repeat_c:
    distinct_from: [method_0010, method_0003, method_0001, method_0002, method_0008]
  $transformer:
    distinct_from: [method_0004]   # Transformer-based time series forecasting

nodes:
  $paper:
    kind: Paper
    name: Are Transformers Effective for Time Series Forecasting?
    identifiers: ['arxiv:2205.13504']
    description: >-
      Questions whether Transformer-based models are effective for long-term time series forecasting and
      introduces DLinear, a decomposition plus one-layer linear model, which outperforms Transformer-based
      methods on nine real-life datasets in most cases.
    year: 2023
    material: papers/2023-DLinear/paper.md
    CITES:
    - to: $fedformer_paper
      description: >-
        Results of FEDformer, Autoformer, Informer, LogTrans and Reformer in Tables 2 and 3 are taken from
        this paper.
      source_refs:
      - $paper::References::651:655
      - $paper::5.1 Experimental Settings::172:172
      - $paper::5.1 Experimental Settings::196:196
    - to: $autoformer_paper
      description: >-
        The experimental setting of Tables 2 and 3 follows this paper (together with [28] and [29]); the
        Autoformer, Informer and vanilla Transformer implementations are taken from its code.
      source_refs:
      - $paper::References::638:642
      - $paper::5.2 Comparison of Multivariate Forecasting with Transformers::203:203
      - $paper::A.2 Implementation Details::461:461

  $dlinear:
    kind: Method
    name: DLinear
    definition: >-
      A linear forecasting model that decomposes the input series into a trend component (moving average)
      and a remainder (seasonal) component, applies a one-layer linear mapping to each along the time axis,
      and sums the two outputs as the forecast.

  $repeat_c:
    kind: Method
    name: Repeat-C
    aliases: [Closest Repeat]
    definition: >-
      A naive direct multi-step baseline that repeats the last value of the look-back window as the forecast
      for every future step.

  $fedformer:
    kind: Method
    stub: true
    name: FEDformer
    note: >-
      Cited as [29] Zhou et al., Fedformer: Frequency enhanced decomposed transformer for long-term series
      forecasting. ICML 2022.

  $autoformer:
    kind: Method
    stub: true
    name: Autoformer
    note: >-
      Cited as [27] Xu, Wang, Long et al., Autoformer: Decomposition transformers with auto-correlation
      for long-term series forecasting. NeurIPS 2021.

  $informer:
    kind: Method
    stub: true
    name: Informer
    note: >-
      Cited as [28] Zhou et al., Informer: Beyond efficient transformer for long sequence time-series forecasting.

  $pyraformer:
    kind: Method
    stub: true
    name: Pyraformer
    note: >-
      Cited as [18] Liu et al., Pyraformer: Low-complexity pyramidal attention for long-range time series
      modeling and forecasting.

  $logtrans:
    kind: Method
    stub: true
    name: LogTrans
    note: >-
      Cited as [16] Li et al., Enhancing the locality and breaking the memory bottleneck of transformer
      on time series forecasting.

  $reformer:
    kind: Method
    stub: true
    name: Reformer
    note: >-
      Cited as [14] Kitaev, Kaiser and Levskaya, Reformer: The efficient transformer. ICLR 2019.

  $transformer:
    kind: Method
    stub: true
    name: Transformer
    note: >-
      The vanilla Transformer, cited as [25] Vaswani et al., Attention is all you need. NeurIPS 2017.

  $fedformer_paper:
    kind: Paper
    stub: true
    name: >-
      Fedformer: Frequency enhanced decomposed transformer for long-term series forecasting
    note: >-
      Cited as [29] Tian Zhou, Ziqing Ma, Qingsong Wen, Xue Wang, Liang Sun, and Rong Jin. In International
      Conference on Machine Learning, 2022.

  $autoformer_paper:
    kind: Paper
    stub: true
    name: >-
      Autoformer: Decomposition transformers with auto-correlation for long-term series forecasting
    note: >-
      Cited as [27] Jiehui Xu, Jianmin Wang, Mingsheng Long, et al. Advances in Neural Information Processing
      Systems, 34, 2021.

  # S5.T2：5.1 Experimental Settings，第 148–172 行
  $x_t2:
    kind: Experiment
    anchors: [S5.T2]
    text: >-
      Multivariate long-term forecasting on Electricity, Exchange-Rate, Traffic, Weather and ILI comparing
      DLinear with six Transformer-based methods and the naive Repeat-C baseline under the look-back window
      used by prior Transformer work. Multivariate; MSE and MAE, lower is better. Look-back window L=96
      and horizon T in {96, 192, 336, 720} for Electricity, Exchange-Rate, Traffic and Weather; L=36 and
      T in {24, 36, 48, 60} for ILI. Variant labels as printed: DLinear-S shares one linear layer across
      all variates (the paper's default); DLinear-I uses an individual linear layer per variate. FEDformer
      here is FEDformer-f, the Fourier variant (line 146). Rows marked * (DLinear-S, DLinear-I, Pyraformer,
      Repeat-C) were run by the authors; the other rows are taken from the FEDformer paper (line 172). Data
      split: the long-term forecasting convention of prior Transformer work (Autoformer setting). Metrics:
      MSE, MAE.
    note: >-
      The caption says "four datasets are with L=96" although five datasets are shown; with line 247 ("In
      Table 2 ... fix the look-back window size as 96") it reads as L=96 for the four non-ILI datasets and
      L=36 for ILI.
    FROM:
    - to: $paper
      locators:
      - 5.1 Experimental Settings::148:172
      - 5.2 Comparison of Multivariate Forecasting with Transformers::203:203
    EVALUATES:
    - to: $dlinear
      role: target
      description: 'Variants as printed: DLinear-S, DLinear-I. Run by the authors of this paper.'
    - to: $fedformer
      role: baseline
      description: >-
        Results taken from "Fedformer: Frequency enhanced decomposed transformer for long-term series forecasting".
      source_refs: ['$paper::5.1 Experimental Settings::172:172']
    - to: $autoformer
      role: baseline
      description: >-
        Results taken from "Fedformer: Frequency enhanced decomposed transformer for long-term series forecasting".
      source_refs: ['$paper::5.1 Experimental Settings::172:172']
    - to: $informer
      role: baseline
      description: >-
        Results taken from "Fedformer: Frequency enhanced decomposed transformer for long-term series forecasting".
      source_refs: ['$paper::5.1 Experimental Settings::172:172']
    - to: $pyraformer
      role: baseline
      description: Re-run by the authors of this paper.
      source_refs: ['$paper::5.1 Experimental Settings::172:172']
    - to: $logtrans
      role: baseline
      description: >-
        Results taken from "Fedformer: Frequency enhanced decomposed transformer for long-term series forecasting".
      source_refs: ['$paper::5.1 Experimental Settings::172:172']
    - to: $reformer
      role: baseline
      description: >-
        Results taken from "Fedformer: Frequency enhanced decomposed transformer for long-term series forecasting".
      source_refs: ['$paper::5.1 Experimental Settings::172:172']
    - to: $repeat_c
      role: baseline
      description: Re-run by the authors of this paper.
      source_refs: ['$paper::5.1 Experimental Settings::172:172']
    USES:
    - to: dataset_0006   # Electricity
      role: evaluation_data
    - to: dataset_0010   # Exchange-Rate
      role: evaluation_data
    - to: dataset_0007   # Traffic
      role: evaluation_data
    - to: dataset_0008   # Weather
      role: evaluation_data
    - to: dataset_0009   # ILI
      role: evaluation_data
    ON_TASK: [task_0002]   # Long-term time series forecasting

