graph-doc: v0.1
by: claude

nodes:
  $task_tsf:
    kind: Task
    name: Time series forecasting
    aliases: [TSF, time-series forecasting]
    definition: >-
      Given a window of past observations (the look-back window, length L), predict the values of the next
      T time steps. Series may be univariate or multivariate; evaluation compares forecasts with ground
      truth over the forecast horizon.

  $task_ltsf:
    kind: Task
    name: Long-term time series forecasting
    aliases: [LTSF, long sequence time-series forecasting, LSTF]
    definition: >-
      Time series forecasting with a long forecast horizon (T much larger than 1, typically tens to hundreds
      of steps).
    BROADER: [$task_tsf]

  $task_ts_repr:
    kind: Task
    name: Time series representation learning
    aliases: [time-series representation learning]
    definition: >-
      Learning reusable representations from (usually unlabeled) time series, assessed by performance on
      downstream tasks such as forecasting or classification, possibly after transfer to other datasets.

  $mc_multistep:
    kind: Method
    name: Multi-step forecasting strategy
    aliases: [multi-step prediction strategy]
    definition: >-
      How a model produces forecasts for more than one future step. The two main families are iterated multi-step
      forecasting and direct multi-step forecasting.

  $mc_ims:
    kind: Method
    name: Iterated multi-step forecasting
    aliases: [IMS, recursive multi-step forecasting]
    definition: >-
      Train a one-step-ahead forecaster and apply it repeatedly, feeding each prediction back as input to
      produce the next step.
    BROADER: [$mc_multistep]

  $mc_dms:
    kind: Method
    name: Direct multi-step forecasting
    aliases: [DMS, direct multi-step strategy]
    definition: >-
      Optimize the multi-step forecasting objective directly and output all future steps without feeding
      predictions back as inputs.
    BROADER: [$mc_multistep]

  $mc_tsf_transformer:
    kind: Method
    name: Transformer-based time series forecasting
    aliases: [time series Transformer, Transformer-based TSF]
    definition: >-
      Forecasting models whose backbone is a Transformer (self-attention). Design choices vary in input
      embedding, attention mechanism, use of series decomposition, and how the multi-step output is decoded.

  $mc_efficient_attention:
    kind: Method
    name: Efficient attention
    aliases: [efficient self-attention]
    definition: >-
      Mechanisms that reduce the quadratic time and memory cost of standard self-attention in sequence length,
      e.g. sparse attention patterns, low-rank approximations, hierarchical structures, and frequency-domain
      transforms.

  $mc_sparse_attention:
    kind: Method
    name: Sparse attention
    definition: >-
      Attention in which each query attends only to a selected subset of keys, according to a fixed pattern
      or a learned or data-dependent selection, instead of all positions.
    BROADER: [$mc_efficient_attention]

  $mc_decomposition:
    kind: Method
    name: Seasonal-trend decomposition
    aliases: [series decomposition, trend-seasonal decomposition]
    definition: >-
      Split a time series into a trend (or trend-cyclical) component and a seasonal (or remainder) component
      that are handled separately and recombined. The trend is often extracted with a moving average, and
      the remainder is the series minus the trend. Can be applied as preprocessing or inside a model.

  $mc_linear_forecaster:
    kind: Method
    name: Linear forecasting model
    aliases: [linear forecaster]
    definition: >-
      Models that map the look-back window to the forecast horizon with a linear transformation, such as
      a single fully connected layer.

  $mc_patching:
    kind: Method
    name: Patching
    aliases: [patch-based tokenization]
    definition: >-
      Segment a sequence into contiguous, possibly overlapping sub-sequences (patches) and use each patch
      as one input token. Splitting an image into patches as tokens follows the same idea.

  $mc_channel_independence:
    kind: Method
    name: Channel independence
    aliases: [channel-independent modeling]
    definition: >-
      For multivariate series, feed each variable (channel) to the same model as a separate univariate series
      with shared weights, without mixing channels at the input. The alternative, channel mixing, feeds
      the multivariate vector of each time step as one input.

  $mc_instance_norm:
    kind: Method
    name: Instance normalization
    definition: >-
      Normalize each input instance individually using statistics computed from that instance alone (e.g.
      to zero mean and unit variance), rather than statistics of a batch or of the whole dataset.

  $mc_masked_pretraining:
    kind: Method
    name: Masked modeling self-supervised pre-training
    aliases: [masked modeling, masked autoencoding]
    definition: >-
      Randomly mask part of the input (e.g. words, image patches, time steps or time-series patches) and
      train the model to reconstruct the masked content from unlabeled data; the pre-trained model is then
      fine-tuned or transferred to downstream tasks.

  # verified: true
  # source: https://github.com/zhouhaoyi/ETDataset
  # source: https://github.com/zhouhaoyi/ETDataset/tree/main/ETT-small
  $res_ett:
    kind: Dataset
    name: ETT
    aliases: [Electricity Transformer Temperature, ETDataset]
    identifiers: ['url:https://github.com/zhouhaoyi/ETDataset']
    description: >-
      Electricity transformer data from July 2016 to July 2018, released with Informer (Zhou et al., 2021).
      Each record has 7 variables: six power load features (HUFL, HULL, MUFL, MULL, LUFL, LULL) and oil
      temperature (OT). The commonly used ETT-small part contains two transformers, each at hourly (ETTh1,
      ETTh2) and 15-minute (ETTm1, ETTm2) resolution.
    note: >-
      The repository also has larger ETT-large and ETT-full parts; the names ETTh1, ETTh2, ETTm1 and ETTm2
      refer to ETT-small.
    FOR_TASK: [$task_ltsf]

  # verified: true
  # source: https://raw.githubusercontent.com/zhouhaoyi/ETDataset/main/ETT-small/ETTh1.csv
  $res_etth1:
    kind: Dataset
    name: ETTh1
    identifiers: ['url:https://github.com/zhouhaoyi/ETDataset']
    description: >-
      Hourly data of the first transformer in ETT-small; 7 variables, 17,420 time steps from 2016-07-01
      00:00 to 2018-06-26 19:00.
    PART_OF: [$res_ett]

  # verified: true
  # source: https://github.com/zhouhaoyi/ETDataset
  $res_etth2:
    kind: Dataset
    name: ETTh2
    identifiers: ['url:https://github.com/zhouhaoyi/ETDataset']
    description: Hourly data of the second transformer in ETT-small; 7 variables.
    PART_OF: [$res_ett]

  # verified: true
  # source: https://raw.githubusercontent.com/zhouhaoyi/ETDataset/main/ETT-small/ETTm1.csv
  $res_ettm1:
    kind: Dataset
    name: ETTm1
    identifiers: ['url:https://github.com/zhouhaoyi/ETDataset']
    description: >-
      15-minute data of the first transformer in ETT-small; 7 variables, 69,680 time steps from 2016-07-01
      00:00 to 2018-06-26 19:45.
    PART_OF: [$res_ett]

  # verified: true
  # source: https://github.com/zhouhaoyi/ETDataset
  $res_ettm2:
    kind: Dataset
    name: ETTm2
    identifiers: ['url:https://github.com/zhouhaoyi/ETDataset']
    description: 15-minute data of the second transformer in ETT-small; 7 variables.
    PART_OF: [$res_ett]

  # verified: true
  # source: https://github.com/laiguokun/multivariate-time-series-data
  # source: https://arxiv.org/abs/1703.07015
  # source: https://archive.ics.uci.edu/dataset/321/electricityloaddiagrams20112014
  $res_electricity:
    kind: Dataset
    name: Electricity
    aliases: [ECL, Electricity Consuming Load]
    identifiers:
    - url:https://github.com/laiguokun/multivariate-time-series-data
    description: >-
      Hourly electricity consumption of 321 clients from 2012 to 2014 (26,304 time steps), prepared by LSTNet
      (Lai et al., 2018) from the UCI ElectricityLoadDiagrams20112014 data (370 clients recorded every 15
      minutes, 2011-2014) by removing 2011 and aggregating to hourly values.
    note: >-
      Differs from the raw UCI data (370 clients, 15-minute); results on the two versions are not directly
      comparable.
    FOR_TASK: [$task_tsf]

  # verified: true
  # source: https://arxiv.org/abs/1703.07015
  # source: https://github.com/laiguokun/multivariate-time-series-data
  $res_traffic:
    kind: Dataset
    name: Traffic
    aliases: [PeMS traffic occupancy]
    identifiers:
    - url:https://github.com/laiguokun/multivariate-time-series-data
    description: >-
      Hourly road occupancy rates (between 0 and 1) measured by 862 sensors on San Francisco Bay Area freeways,
      from the California Department of Transportation (PeMS), 2015-2016, 17,544 time steps; prepared by
      LSTNet (Lai et al., 2018).
    note: >-
      A processed version of PeMS data; other PeMS-derived traffic datasets (different sensors, periods
      or measures) are different resources.
    FOR_TASK: [$task_tsf]

  # verified: true
  # source: https://arxiv.org/abs/2106.13008
  $res_weather:
    kind: Dataset
    name: Weather
    identifiers: ['url:https://www.bgc-jena.mpg.de/wetter/']
    description: >-
      21 meteorological indicators (e.g. air temperature, humidity) recorded every 10 minutes over the year
      2020 by the weather station of the Max Planck Institute for Biogeochemistry in Jena; the forecasting
      version was prepared by Autoformer (Wu et al., 2021).
    FOR_TASK: [$task_ltsf]

  # verified: true
  # source: https://arxiv.org/abs/2106.13008
  $res_ili:
    kind: Dataset
    name: ILI
    aliases: [Influenza-like Illness, National Illness]
    identifiers:
    - url:https://gis.cdc.gov/grasp/fluview/fluportaldashboard.html
    description: >-
      Weekly influenza-like illness (ILI) surveillance data from the US Centers for Disease Control and
      Prevention, 2002-2021, describing the ratio of patients seen with ILI to the total number of patients;
      the forecasting version was prepared by Autoformer (Wu et al., 2021).
    FOR_TASK: [$task_ltsf]

  # verified: true
  # source: https://arxiv.org/abs/1703.07015
  # source: https://github.com/laiguokun/multivariate-time-series-data
  $res_exchange:
    kind: Dataset
    name: Exchange-Rate
    aliases: [Exchange, exchange_rate]
    identifiers:
    - url:https://github.com/laiguokun/multivariate-time-series-data
    description: >-
      Daily exchange rates of eight countries (Australia, Britain, Canada, Switzerland, China, Japan, New
      Zealand, Singapore) from 1990 to 2016, 7,588 time steps; prepared by LSTNet (Lai et al., 2018).
    FOR_TASK: [$task_tsf]
