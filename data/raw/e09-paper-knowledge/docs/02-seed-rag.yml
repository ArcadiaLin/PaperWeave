# 种子：由 data/raw/e09-paper-knowledge/seeds/rag.yml 一次性转换（2026-10-05），内容未改。
# 撰写约定见 seeds/README.md；节点前的 verified / source 注释是核对记录，不写进图。
# 种子是经整理的可信批量入库：写入时不查重（--no-dedup）。

graph-doc: v0.1
by: claude

nodes:
  $task_qa:
    kind: Task
    name: Question answering
    aliases: [QA]
    definition: >-
      Given a natural-language question (and possibly documents or a corpus), produce an answer. When reference
      answers exist, answers are compared against them.

  $task_single_hop_qa:
    kind: Task
    name: Single-hop question answering
    aliases: [single-hop QA]
    definition: >-
      Question answering whose answer can be obtained from a single piece of evidence, without combining
      information from multiple passages.
    note: >-
      Independent of whether the setting is open-domain or closed-book; open-domain QA is not a synonym
      of single-hop QA.
    BROADER: [$task_qa]

  $task_multihop_qa:
    kind: Task
    name: Multi-hop question answering
    aliases: [multi-hop QA]
    definition: >-
      Question answering that requires combining information from two or more pieces of evidence, e.g. first
      identifying a bridge entity and then using it to find the answer.
    BROADER: [$task_qa]

  $task_narrative_qa:
    kind: Task
    name: Narrative question answering
    aliases: [narrative comprehension QA]
    definition: >-
      Questions about long narratives such as books or scripts, whose answers depend on understanding events,
      characters and their relations across the whole story.
    BROADER: [$task_qa]

  $task_global_qa:
    kind: Task
    name: Corpus-level sensemaking question answering
    aliases: [global sensemaking, global questions]
    definition: >-
      Questions directed at a corpus as a whole rather than at a specific fact (e.g. the main themes across
      all documents); answers synthesize information from many parts of the corpus. Usually there is no
      single reference answer.
    BROADER: [$task_qa]

  $task_qfs:
    kind: Task
    name: Query-focused summarization
    aliases: [QFS, query-focused multi-document summarization]
    definition: >-
      Given a query and a set of documents, produce a summary of the documents that addresses the query.

  $task_passage_retrieval:
    kind: Task
    name: Passage retrieval
    definition: >-
      Given a query, find and rank passages in a corpus that are relevant to it or that support its answer.

  $mc_rag:
    kind: Method
    name: Retrieval-augmented generation
    aliases: [RAG]
    definition: >-
      Retrieve content from an external corpus and provide it to a language model as context for generating
      the output, without changing model parameters.

  $mc_naive_rag:
    kind: Method
    name: Naive vector RAG
    aliases: [naive RAG, vector RAG, standard RAG]
    definition: >-
      Split the corpus into text chunks, embed them as vectors, and at query time retrieve the most similar
      chunks by vector similarity as context.
    BROADER: [$mc_rag]

  $mc_graph_rag:
    kind: Method
    name: Graph-based retrieval-augmented generation
    aliases: [graph-based RAG, graph RAG]
    definition: >-
      Retrieval-augmented generation that builds a graph over the corpus (e.g. entities and relations, or
      connected passages) and uses the graph's connections, traversal or aggregation to retrieve and organize
      context.
    note: >-
      A specific method may be named GraphRAG; that method and this category are different nodes.
    BROADER: [$mc_rag]

  $mc_llm_kg_construction:
    kind: Method
    name: LLM-based knowledge graph construction
    aliases: [LLM-based KG construction]
    definition: >-
      Use a large language model to extract entities and relations (and optionally their descriptions) from
      text and assemble them into a graph.
    OVERLAPS_WITH: [$mc_openie]

  $mc_openie:
    kind: Method
    name: Open information extraction
    aliases: [OpenIE]
    definition: >-
      Extract (subject, relation phrase, object) triples from text without a predefined set of relation
      types.

  $mc_community_summary:
    kind: Method
    name: Community-based hierarchical summarization
    aliases: [hierarchical community summaries]
    definition: >-
      Detect communities of nodes in a graph at several levels (e.g. with the Leiden algorithm) and generate
      a summary for each community, so the underlying content can be described at different levels of granularity.

  $mc_ppr_retrieval:
    kind: Method
    name: Personalized PageRank graph retrieval
    aliases: [PPR-based retrieval]
    definition: >-
      Run Personalized PageRank (a random walk with restart to query-related seed nodes) on a graph and
      rank nodes, or the passages associated with them, by the resulting scores.

  $mc_dense_retrieval:
    kind: Method
    name: Dense retrieval
    aliases: [embedding-based retrieval]
    definition: >-
      Encode queries and documents as dense vectors with neural encoders and retrieve by vector similarity;
      includes single-vector and multi-vector (late-interaction) models.

  $mc_sparse_retrieval:
    kind: Method
    name: Sparse retrieval
    aliases: [lexical retrieval, term-based retrieval]
    definition: >-
      Retrieval based on matching and weighting terms shared by the query and the document, e.g. TF-IDF
      or BM25.

  $mc_multistep_retrieval:
    kind: Method
    name: Multi-step retrieval
    aliases: [iterative retrieval]
    definition: >-
      Retrieve repeatedly, forming each new query from previously retrieved content or intermediate reasoning,
      to collect evidence step by step.

  $mc_query_reformulation:
    kind: Method
    name: Query reformulation
    definition: >-
      Transform the user query before retrieval, for example by rewriting, decomposing it into sub-queries,
      disambiguating, expanding it, or generating a hypothetical answer document to use as the query.

  $mc_llm_judge:
    kind: Method
    name: LLM-as-a-judge evaluation
    aliases: [LLM-as-a-judge, LLM-based evaluation]
    definition: >-
      Use a large language model to assess outputs against given criteria, either by scoring a single output
      or by comparing two outputs (pairwise) and choosing a winner or a tie; pairwise judgments are aggregated
      into win rates.

  $mc_nonparam_memory:
    kind: Method
    name: Non-parametric memory for LLMs
    aliases: [non-parametric memory]
    definition: >-
      Store knowledge for a language model outside its parameters (e.g. in a corpus, an index or a graph)
      and access it through retrieval.

  $mc_llm_continual_learning:
    kind: Method
    name: Continual learning for LLMs
    aliases: [continual learning]
    definition: >-
      Enable a language model to keep acquiring new knowledge over time while retaining what it has learned,
      either by updating parameters or by non-parametric means.

  # verified: true
  # source: https://arxiv.org/abs/1809.09600
  # source: https://hotpotqa.github.io/
  $res_hotpotqa:
    kind: Dataset
    name: HotpotQA
    identifiers: ['url:https://hotpotqa.github.io/']
    description: >-
      113k Wikipedia-based multi-hop question-answer pairs (Yang et al., 2018) with sentence-level supporting
      facts and factoid comparison questions; evaluated in a distractor setting (10 given paragraphs) and
      a fullwiki setting (all of Wikipedia).
    FOR_TASK: [$task_multihop_qa]

  # verified: true
  # source: https://github.com/Alab-NII/2wikimultihop
  $res_2wiki:
    kind: Dataset
    name: 2WikiMultiHopQA
    aliases: [2WikiMQA, 2Wiki]
    identifiers: ['url:https://github.com/Alab-NII/2wikimultihop']
    description: >-
      Multi-hop QA dataset built from Wikipedia paragraphs and Wikidata (Ho et al., COLING 2020); each question
      has evidence triples and supporting facts. Question types are comparison, inference, compositional
      and bridge-comparison.
    note: >-
      Treat 2Wiki as a candidate match; confirm the dataset identity from the surrounding context or citation
      before reusing this node.
    FOR_TASK: [$task_multihop_qa]

  # verified: true
  # source: https://arxiv.org/abs/2108.00573
  # source: https://github.com/StonyBrookNLP/musique
  $res_musique:
    kind: Dataset
    name: MuSiQue
    identifiers: ['url:https://github.com/StonyBrookNLP/musique']
    description: >-
      Multi-hop QA dataset composed from single-hop questions (Trivedi et al., TACL 2022), constructed to
      require connected multi-hop reasoning. Released in two versions: MuSiQue-Ans (about 25k answerable
      questions with 2-4 hops) and MuSiQue-Full (adds unanswerable questions).
    note: >-
      Record which version (Ans or Full) is used; results on the two are not comparable.
    FOR_TASK: [$task_multihop_qa]

  # verified: true
  # source: https://aclanthology.org/Q19-1026/
  $res_nq:
    kind: Dataset
    name: Natural Questions
    aliases: [NQ, NaturalQuestions]
    identifiers: ['url:https://ai.google.com/research/NaturalQuestions']
    description: >-
      Real anonymized queries issued to Google search, each paired with a Wikipedia page from the top-5
      results on which annotators marked a long answer (typically a paragraph) and a short answer when present
      (Kwiatkowski et al., TACL 2019); 307,373 training examples, 7,830 development and 7,842 test examples.
    FOR_TASK: [$task_qa]

  # verified: true
  # source: https://arxiv.org/abs/2212.10511
  $res_popqa:
    kind: Dataset
    name: PopQA
    identifiers: ['url:https://huggingface.co/datasets/akariasai/PopQA']
    description: >-
      Open-domain QA dataset of about 14k entity-centric questions (Mallen et al., ACL 2023) designed to
      probe factual knowledge across entities of different popularity.
    FOR_TASK: [$task_qa]

  # verified: true
  # source: https://github.com/infinigence/LVEval
  $res_lveval:
    kind: Benchmark
    name: LV-Eval
    identifiers: ['url:https://github.com/infinigence/LVEval']
    description: >-
      Bilingual (English and Chinese) long-context benchmark of 11 single-hop and multi-hop QA datasets
      at five length levels (16k to 256k words). Contexts include confusing facts and keyword and phrase
      replacements, intended to reduce knowledge leakage. One of the datasets is hotpotwikiqa-mixup.
    note: Results depend on the dataset and length level; record both where used.

  # verified: true
  # source: https://arxiv.org/abs/1712.07040
  # source: https://github.com/google-deepmind/narrativeqa
  $res_narrativeqa:
    kind: Dataset
    name: NarrativeQA
    identifiers: ['url:https://github.com/google-deepmind/narrativeqa']
    description: >-
      Reading comprehension dataset over entire books and movie scripts (Kočiský et al., TACL 2018); questions
      and answers were written from Wikipedia summaries of the stories, with two reference answers per question.
    FOR_TASK: [$task_narrative_qa]

  # verified: true
  # source: https://arxiv.org/html/2409.05591v1
  $res_ultradomain:
    kind: Benchmark
    name: UltraDomain
    identifiers: ['url:https://huggingface.co/datasets/TommyChien/UltraDomain']
    description: >-
      Long-context RAG benchmark released with MemoRAG (Qian et al., 2024). Contexts come from 428 college
      textbooks spanning 18 domains, plus financial reports, legal contracts and a mixed set; question-answer
      pairs were generated with strong LLMs.

  # verified: true
  # source: https://huggingface.co/datasets/TommyChien/UltraDomain
  $res_ultradomain_agriculture:
    kind: Dataset
    name: UltraDomain Agriculture
    identifiers: ['url:https://huggingface.co/datasets/TommyChien/UltraDomain']
    description: Agriculture subset of UltraDomain.
    PART_OF: [$res_ultradomain]

  # verified: false
  $res_ultradomain_cs:
    kind: Dataset
    name: UltraDomain CS
    identifiers: ['url:https://huggingface.co/datasets/TommyChien/UltraDomain']
    description: Computer science subset of UltraDomain.
    PART_OF: [$res_ultradomain]

  # verified: false
  $res_ultradomain_legal:
    kind: Dataset
    name: UltraDomain Legal
    identifiers: ['url:https://huggingface.co/datasets/TommyChien/UltraDomain']
    description: Legal subset of UltraDomain.
    PART_OF: [$res_ultradomain]

  # verified: false
  $res_ultradomain_mix:
    kind: Dataset
    name: UltraDomain Mix
    identifiers: ['url:https://huggingface.co/datasets/TommyChien/UltraDomain']
    description: Mixed-source subset of UltraDomain.
    PART_OF: [$res_ultradomain]

  # verified: true
  # source: https://arxiv.org/abs/2401.15391
  # source: https://github.com/yixuantt/MultiHop-RAG
  $res_multihop_rag:
    kind: Benchmark
    name: MultiHop-RAG
    identifiers: ['url:https://github.com/yixuantt/MultiHop-RAG']
    description: >-
      RAG benchmark of 2,556 multi-hop queries (Tang & Yang, 2024) whose evidence spans 2 to 4 documents.
      The knowledge base is English news articles collected via the mediastack API and published from 2023-09-26
      to 2023-12-26, each with metadata (title, date, author, category, source).
    FOR_TASK: [$task_multihop_qa]

  # verified: true
  # source: https://arxiv.org/abs/2112.09118
  # source: https://github.com/facebookresearch/contriever
  $res_contriever:
    kind: Model
    name: Contriever
    aliases: [facebook/contriever]
    identifiers: ['url:https://github.com/facebookresearch/contriever']
    description: >-
      Dense retriever trained without supervision by contrastive learning (Izacard et al., 2022); released
      checkpoints include contriever and the MS MARCO fine-tuned contriever-msmarco.
    note: Model family entry; record which checkpoint was used.

  # verified: true
  # source: https://arxiv.org/abs/2112.01488
  $res_colbertv2:
    kind: Model
    name: ColBERTv2
    identifiers: ['url:https://github.com/stanford-futuredata/ColBERT']
    description: >-
      Late-interaction retriever that represents queries and documents with one vector per token (Santhanam
      et al., 2022), combining residual compression with denoised supervision.

  # verified: true
  # source: https://arxiv.org/abs/2112.07899
  $res_gtr:
    kind: Model
    name: GTR
    aliases: [Generalizable T5-based dense Retrievers]
    identifiers: ['url:https://github.com/google-research/t5x_retrieval']
    description: >-
      Family of T5-based dual-encoder dense retrievers (Ni et al., 2022) that scale the encoder while keeping
      the embedding size fixed, trained in multiple stages; released in several sizes (e.g. gtr-t5-base
      to gtr-t5-xxl).
    note: Model family entry; record which size was used.

  # verified: true
  # source: https://huggingface.co/nvidia/NV-Embed-v2
  $res_nv_embed_v2:
    kind: Model
    name: NV-Embed-v2
    aliases: [nvidia/NV-Embed-v2]
    identifiers: ['url:https://huggingface.co/nvidia/NV-Embed-v2']
    description: >-
      Text embedding model from NVIDIA built on the decoder-only Mistral-7B-v0.1 (about 8B parameters, 4096-dimensional
      embeddings); CC-BY-NC-4.0 license.

  # verified: false
  $res_gpt35_turbo:
    kind: Model
    name: GPT-3.5-turbo
    aliases: [gpt-3.5-turbo]
    identifiers: ['url:https://platform.openai.com/docs/models']
    description: >-
      Chat model family served by OpenAI through its API, with dated snapshots (e.g. gpt-3.5-turbo-1106).
    note: Model family entry; snapshots differ, so record the snapshot used.

  # verified: true
  # source: https://openai.com/index/new-models-and-developer-products-announced-at-devday/
  $res_gpt4_turbo:
    kind: Model
    name: GPT-4-turbo
    aliases: [gpt-4-turbo]
    identifiers: ['url:https://platform.openai.com/docs/models']
    description: >-
      GPT-4 series model served by OpenAI through its API, announced in November 2023 with a 128k-token
      context window.
    note: Model family entry; snapshots differ, so record the snapshot used.

  # verified: true
  # source: https://openai.com/index/gpt-4o-mini-advancing-cost-efficient-intelligence/
  $res_gpt4o_mini:
    kind: Model
    name: GPT-4o-mini
    aliases: [gpt-4o-mini]
    identifiers: ['url:https://platform.openai.com/docs/models']
    description: >-
      Small model served by OpenAI through its API, released on 2024-07-18 with a 128k-token context window;
      snapshots include gpt-4o-mini-2024-07-18.
    note: Model family entry; snapshots differ, so record the snapshot used.

  # verified: true
  # source: https://huggingface.co/meta-llama/Meta-Llama-3-70B-Instruct
  $res_llama3_8b_instruct:
    kind: Model
    name: Llama-3-8B-Instruct
    aliases: [Meta-Llama-3-8B-Instruct]
    identifiers:
    - url:https://huggingface.co/meta-llama/Meta-Llama-3-8B-Instruct
    description: >-
      Open-weight instruction-tuned model released by Meta on 2024-04-18; 8B parameters, 8k-token context.

  # verified: true
  # source: https://huggingface.co/meta-llama/Meta-Llama-3-70B-Instruct
  $res_llama3_70b_instruct:
    kind: Model
    name: Llama-3-70B-Instruct
    aliases: [Meta-Llama-3-70B-Instruct]
    identifiers:
    - url:https://huggingface.co/meta-llama/Meta-Llama-3-70B-Instruct
    description: >-
      Open-weight instruction-tuned model released by Meta on 2024-04-18; 70B parameters, 8k-token context.

  # verified: true
  # source: https://huggingface.co/meta-llama/Llama-3.3-70B-Instruct
  $res_llama33_70b_instruct:
    kind: Model
    name: Llama-3.3-70B-Instruct
    identifiers:
    - url:https://huggingface.co/meta-llama/Llama-3.3-70B-Instruct
