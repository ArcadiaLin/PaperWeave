# 论文 2023-PatchTST：由 data/raw/e09-paper-knowledge/forms/2023-PatchTST.yml（paper-form-v2，报告级）一次性转换（2026-10-05）。
# 转换规则：表单的 setting、切分约定与指标并入实验的 text（模型中没有 Metric 与条件字段）；切分依据的行加入 FROM 的 locators；
# 参与方的变体与结果来源（own / rerun / cited / unstated）写进 EVALUATES 边的 description，依据行写进 source_refs；
# 原文的笔误印法写进 USES 边的 description。已有对象按名称在库中解析为 id；查重判断见 confirm。

graph-doc: v0.1
by: claude
confirm:
  $paper:
    distinct_from: [paper_0001, paper_0003, paper_0002]
  $patchtst:
    distinct_from: [method_0009, method_0010, method_0004, method_0012, method_0007]
  $btsf:
    distinct_from: [method_0004]   # Transformer-based time series forecasting
  $tnc:
    distinct_from: [method_0004, method_0028]
  $ts_tcc:
    distinct_from: [method_0004, method_0024, method_0002, method_0003, method_0016]
  $btsf_paper:
    distinct_from: [paper_0001, paper_0003, paper_0002]
  $ts2vec_paper:
    distinct_from: [paper_0001, paper_0002, paper_0003]

nodes:
  $paper:
    kind: Paper
    name: 'A Time Series is Worth 64 Words: Long-term Forecasting with Transformers'
    identifiers: ['arxiv:2211.14730']
    description: >-
      Proposes PatchTST, a Transformer for multivariate time series forecasting and self-supervised representation
      learning based on patching and channel independence.
    year: 2023
    material: papers/2023-PatchTST/paper.md
    CITES:
    - to: paper_0001   # Are Transformers Effective for Time Series Forecasting?
      description: >-
        Results of DLinear, Pyraformer and LogTrans in Table 3, all baselines in Table 8, and the non-CI
        baselines in Table 15 are collected from this paper.
      source_refs:
      - $paper::References::488:491
      - $paper::4.1 Long-term Time series forecasting::128:128
      - $paper::A.3 Univariate Forecasting::567:567
      - $paper::A.7.2 Performance of Channel-independence on Other Models::900:900
    - to: $ts2vec_paper
      description: TS2Vec results in Table 6 are cited from this paper.
      source_refs: ['$paper::References::482:486', '$paper::4.2 Representation learning::212:212']
    - to: $btsf_paper
      description: BTSF, TNC and TS-TCC results in Table 6 are cited from this paper.
      source_refs: ['$paper::References::477:481', '$paper::4.2 Representation learning::212:212']

  $patchtst:
    kind: Method
    name: PatchTST
    definition: >-
      A Transformer encoder for time series that splits each univariate channel into subseries-level patches
      used as input tokens, and processes channels independently with shared weights.

  $btsf:
    kind: Method
    stub: true
    name: BTSF
    note: >-
      Cited as Yang & Hong (2022), Unsupervised time-series representation learning with iterative bilinear
      temporal-spectral fusion.

  $ts2vec:
    kind: Method
    stub: true
    name: TS2Vec
    note: >-
      Cited as Yue et al. (2022), Ts2vec: Towards universal representation of time series.

  $tnc:
    kind: Method
    stub: true
    name: TNC
    note: >-
      Cited as Tonekaboni et al. (2021), Unsupervised representation learning for time series with temporal
      neighborhood coding.

  $ts_tcc:
    kind: Method
    stub: true
    name: TS-TCC
    note: >-
      Cited as Eldele et al. (2021), Time-series representation learning via temporal and contextual contrasting.

  $btsf_paper:
    kind: Paper
    stub: true
    name: >-
      Unsupervised time-series representation learning with iterative bilinear temporal-spectral fusion
    note: Cited as Yang & Hong (2022). Ling Yang and Shenda Hong. In ICML, 2022.

  $ts2vec_paper:
    kind: Paper
    stub: true
    name: 'Ts2vec: Towards universal representation of time series'
    note: >-
      Cited as Yue et al. (2022). Zhihan Yue, Yujing Wang, Juanyong Duan, Tianmeng Yang, Congrui Huang,
      Yunhai Tong, and Bixiong Xu. In Proceedings of the AAAI Conference on Artificial Intelligence, volume
      36, 2022.

  # S1.T1：1 Introduction，第 26–48 行
  $x_t1:
    kind: Experiment
    anchors: [S1.T1]
    text: >-
      Case study on Traffic: channel-independent PatchTST with different look-back windows, numbers of input
      tokens, patching and self-supervised pre-training, against channel-mixing FEDformer and DLinear; plus
      training time with and without patching on three datasets. Multivariate; horizon T=96; MSE, lower
      is better. PatchTST rows vary the look-back window L and the number of input tokens N; "down-sampled"
      samples every 4 steps and adds the last value; the best row uses self-supervised pre-training, all
      others supervised training. FEDformer and DLinear use L=336. Second sub-table: training running time
      in seconds with L=336 on Traffic, Electricity and Weather, with and without patching (patch length
      16, stride 8, line 48). Data split: the long-term forecasting convention of prior Transformer work
      (Autoformer setting). Metrics: MSE, Training time.
    note: >-
      Split convention inferred from the experimental setup stated in Section 4.1 (line 128). DLinear's
      0.410 equals DLinear-S on Traffic at T=96 in the DLinear paper's Table 4 (L=336). FEDformer is reported
      here at L=336 (0.597), whereas Table 3 reports its best of six look-back windows; the source of the
      FEDformer number is not stated.
    FROM:
    - to: $paper
      locators: ['1 Introduction::26:48', '4.1 Long-term Time series forecasting::128:128']
    EVALUATES:
    - to: $patchtst
      role: target
      description: Run by the authors of this paper.
    - to: method_0029   # FEDformer
      role: baseline
      description: The paper does not state where these results come from.
    - to: method_0027   # DLinear
      role: baseline
      description: The paper does not state where these results come from.
    USES:
    - to: dataset_0007   # Traffic
      role: evaluation_data
    - to: dataset_0006   # Electricity
      role: evaluation_data
    - to: dataset_0008   # Weather
      role: evaluation_data
    ON_TASK: [task_0002]   # Long-term time series forecasting

  # S4.T3：4.1 Long-term Time series forecasting，第 134–169 行
  $x_t3:
    kind: Experiment
    anchors: [S4.T3]
    text: >-
      Multivariate long-term forecasting on eight benchmarks with supervised PatchTST/64 and PatchTST/42
      against DLinear and Transformer-based baselines. Multivariate, supervised training; MSE and MAE, lower
      is better. Horizon T in {24, 36, 48, 60} for ILI and {96, 192, 336, 720} for the others. Variant labels
      as printed: PatchTST/64 uses 64 input patches (L=512), PatchTST/42 uses 42 patches (L=336); both use
      patch length 16 and stride 8. PatchTST/42 is the paper's fair comparison to DLinear and the Transformer
      baselines (line 130). DLinear, Pyraformer and LogTrans results are collected from the DLinear paper
      (line 128), with L=336 for DLinear (L=104 on ILI) and L=96 for Transformer models. FEDformer, Autoformer
      and Informer were re-run with six look-back windows and the best result per task is reported (line
      535; on ILI L in {24, 36, 48, 60, 104, 144}, line 537). PatchTST's own look-back window on ILI is
      not stated. Data split: the long-term forecasting convention of prior Transformer work (Autoformer
      setting). Metrics: MSE, MAE.
    note: >-
      DLinear values equal DLinear-S with L=336 in the DLinear paper's Table 4 except ILI, whose values
      do not appear in the stored version of the DLinear paper. Pyraformer MSE values on Weather, Traffic,
      Electricity and ILI appear shifted down by one horizon relative to the DLinear paper's Table 2 (e.g.
      Weather T=192 is 0.622, DLinear's T=96 value); the MAE values and the ETT rows match.
    FROM:
    - to: $paper
      locators:
      - 4.1 Long-term Time series forecasting::134:169
      - 4.1 Long-term Time series forecasting::128:128
    EVALUATES:
    - to: $patchtst
      role: target
      description: 'Variants as printed: PatchTST/64, PatchTST/42. Run by the authors of this paper.'
    - to: method_0027   # DLinear
      role: baseline
      description: Results taken from "Are Transformers Effective for Time Series Forecasting?".
      source_refs: ['$paper::4.1 Long-term Time series forecasting::128:128']
    - to: method_0029   # FEDformer
      role: baseline
      description: Re-run by the authors of this paper.
      source_refs: ['$paper::A.1.2 Details of Baseline Settings::535:535']
    - to: method_0030   # Autoformer
      role: baseline
      description: Re-run by the authors of this paper.
      source_refs: ['$paper::A.1.2 Details of Baseline Settings::535:535']
    - to: method_0031   # Informer
      role: baseline
      description: Re-run by the authors of this paper.
      source_refs: ['$paper::A.1.2 Details of Baseline Settings::535:535']
    - to: method_0032   # Pyraformer
      role: baseline
      description: Results taken from "Are Transformers Effective for Time Series Forecasting?".
      source_refs: ['$paper::4.1 Long-term Time series forecasting::128:128']
    - to: method_0033   # LogTrans
      role: baseline
      description: Results taken from "Are Transformers Effective for Time Series Forecasting?".
      source_refs: ['$paper::4.1 Long-term Time series forecasting::128:128']
    USES:
    - to: dataset_0008   # Weather
      role: evaluation_data
    - to: dataset_0007   # Traffic
      role: evaluation_data
    - to: dataset_0006   # Electricity
      role: evaluation_data
    - to: dataset_0009   # ILI
      role: evaluation_data
    - to: dataset_0002   # ETTh1
      role: evaluation_data
    - to: dataset_0003   # ETTh2
      role: evaluation_data
    - to: dataset_0004   # ETTm1
      role: evaluation_data
    - to: dataset_0005   # ETTm2
      role: evaluation_data
    ON_TASK: [task_0002]   # Long-term time series forecasting

  # S4.T4：4.2 Representation learning，第 178–194 行
  $x_t4:
    kind: Experiment
    anchors: [S4.T4]
    text: >-
      Multivariate long-term forecasting with self-supervised PatchTST (fine-tuning, linear probing) and
      supervised PatchTST against supervised baselines on Weather, Traffic and Electricity. Multivariate;
      MSE and MAE, lower is better; T in {96, 192, 336, 720}. Self-supervised PatchTST: masked pre-training
      with input length 512 and patch size 12 (42 non-overlapping patches), 40% of patches masked, 100 pre-training
      epochs (line 174). Variant labels as printed: Fine-tuning (end-to-end fine-tuning after pre-training),
      Lin. Prob. (linear probing: only the model head is trained), Sup. (supervised training from scratch).
      Data split: the long-term forecasting convention of prior Transformer work (Autoformer setting). Metrics:
      MSE, MAE.
    note: >-
      Split convention inferred from the experimental setup stated in Section 4.1 (line 128). The Sup. column
      and the DLinear, FEDformer, Autoformer and Informer columns equal the PatchTST/42, DLinear, FEDformer,
      Autoformer and Informer entries of Table 3; the table does not restate their source.
    FROM:
    - to: $paper
      locators:
      - 4.2 Representation learning::178:194
      - 4.1 Long-term Time series forecasting::128:128
    EVALUATES:
    - to: $patchtst
      role: target
      description: >-
        Variants as printed: Fine-tuning, Lin. Prob., Sup.. Run by the authors of this paper.
    - to: method_0027   # DLinear
      role: baseline
      description: The paper does not state where these results come from.
    - to: method_0029   # FEDformer
      role: baseline
      description: The paper does not state where these results come from.
    - to: method_0030   # Autoformer
      role: baseline
      description: The paper does not state where these results come from.
    - to: method_0031   # Informer
      role: baseline
      description: The paper does not state where these results come from.
    USES:
    - to: dataset_0008   # Weather
      role: evaluation_data
    - to: dataset_0007   # Traffic
      role: evaluation_data
    - to: dataset_0006   # Electricity
      role: evaluation_data
    ON_TASK: [task_0002]   # Long-term time series forecasting

  # S4.T5：4.2 Representation learning，第 198–210 行
  $x_t5:
    kind: Experiment
    anchors: [S4.T5]
    text: >-
      Transfer learning: PatchTST pre-trained on Electricity and fine-tuned or linearly probed on Weather
      and Traffic, against supervised baselines. Multivariate; MSE and MAE, lower is better; T in {96, 192,
      336, 720}. PatchTST is pre-trained on Electricity (pre-training setup as in Table 4), then Fine-tuning
      (end-to-end) or Lin. Prob. (head only) on the target dataset; Sup. is supervised PatchTST trained
      from scratch on the target dataset. Electricity is pre-training data, not evaluation data. Data split:
      the long-term forecasting convention of prior Transformer work (Autoformer setting). Metrics: MSE,
      MAE.
    note: >-
      Split convention inferred from the experimental setup stated in Section 4.1 (line 128). The Sup. column
      and the baseline columns equal those of Tables 3 and 4.
    FROM:
    - to: $paper
      locators:
      - 4.2 Representation learning::198:210
      - 4.1 Long-term Time series forecasting::128:128
    EVALUATES:
    - to: $patchtst
      role: target
      description: >-
        Variants as printed: Fine-tuning, Lin. Prob., Sup.. Run by the authors of this paper.
    - to: method_0027   # DLinear
      role: baseline
      description: The paper does not state where these results come from.
    - to: method_0029   # FEDformer
      role: baseline
      description: The paper does not state where these results come from.
    - to: method_0030   # Autoformer
      role: baseline
      description: The paper does not state where these results come from.
    - to: method_0031   # Informer
      role: baseline
      description: The paper does not state where these results come from.
    USES:
    - to: dataset_0008   # Weather
      role: evaluation_data
    - to: dataset_0007   # Traffic
      role: evaluation_data
    ON_TASK: [task_0003]   # Time series representation learning

  # S4.T6：4.2 Representation learning，第 214–223 行
  $x_t6:
    kind: Experiment
    anchors: [S4.T6]
    text: >-
      Comparison of PatchTST's self-supervised representations with contrastive time-series representation
      learning methods on ETTh1, using linear probing. ETTh1; MSE and MAE, lower is better; horizons T in
      {24, 48, 168, 336, 720}. Only the last linear layer is trained on top of the learned representation
      (line 212). Variant labels as printed: Transferred (pre-trained on Traffic, linear probing on ETTh1),
      Self-supervised (pre-training and linear probing on ETTh1). IMP. is the improvement of PatchTST's
      best result over the best baseline. Metrics: MSE, MAE.
    note: >-
      The horizons {24, 48, 168, 336, 720} follow a different protocol from Section 4.1, and the split is
      not stated, so no split convention is recorded.
    FROM:
    - to: $paper
      locators: ['4.2 Representation learning::214:223']
    EVALUATES:
    - to: $patchtst
      role: target
      description: >-
        Variants as printed: Transferred, Self-supervised. Run by the authors of this paper.
    - to: $btsf
      role: baseline
      description: >-
        Results taken from "Unsupervised time-series representation learning with iterative bilinear temporal-spectral
        fusion".
      source_refs: ['$paper::4.2 Representation learning::212:212']
    - to: $ts2vec
      role: baseline
      description: 'Results taken from "Ts2vec: Towards universal representation of time series".'
      source_refs: ['$paper::4.2 Representation learning::212:212']
    - to: $tnc
      role: baseline
      description: >-
        Results taken from "Unsupervised time-series representation learning with iterative bilinear temporal-spectral
        fusion".
      source_refs: ['$paper::4.2 Representation learning::212:212']
    - to: $ts_tcc
      role: baseline
      description: >-
        Results taken from "Unsupervised time-series representation learning with iterative bilinear temporal-spectral
        fusion".
      source_refs: ['$paper::4.2 Representation learning::212:212']
    USES:
    - to: dataset_0002   # ETTh1
      role: evaluation_data
    ON_TASK: [task_0003]   # Time series representation learning

  # S4.T7：4.3 Ablation study，第 230–246 行
  $x_t7:
    kind: Experiment
    anchors: [S4.T7]
    text: >-
      Ablation of patching and channel independence in supervised PatchTST/42 on Weather, Traffic and Electricity,
      with FEDformer as reference. Multivariate; MSE and MAE, lower is better; T in {96, 192, 336, 720}.
      Variant labels as printed (A.4.3, lines 649-655): P+CI (patching and channel independence: the full
      PatchTST/42), CI (channel independence only: patch length and stride set to 1), P (patching with channel
      mixing), Original (neither: the original TST model of Zerveas et al., 2021). '-' marks runs out of
      memory on an NVIDIA A40 48GB. For the ablation, the maximum number of epochs on Electricity and Traffic
      is reduced from 100 to 20 (line 657). Data split: the long-term forecasting convention of prior Transformer
      work (Autoformer setting). Metrics: MSE, MAE.
    note: >-
      Split convention inferred from the experimental setup stated in Section 4.1 (line 128). FEDformer
      values equal Table 3 (re-run, best of six look-back windows); the table does not restate their source.
    FROM:
    - to: $paper
      locators: ['4.3 Ablation study::230:246', '4.1 Long-term Time series forecasting::128:128']
    EVALUATES:
    - to: $patchtst
      role: target
      description: 'Variants as printed: P+CI, CI, P, Original. Run by the authors of this paper.'
    - to: method_0029   # FEDformer
      role: baseline
      description: The paper does not state where these results come from.
    USES:
    - to: dataset_0008   # Weather
      role: evaluation_data
    - to: dataset_0007   # Traffic
      role: evaluation_data
    - to: dataset_0006   # Electricity
      role: evaluation_data
    ON_TASK: [task_0002]   # Long-term time series forecasting

  # A1.T8：A.3 Univariate Forecasting，第 569–588 行
  $x_t8:
    kind: Experiment
    anchors: [A1.T8]
    text: >-
      Univariate long-term forecasting on the four ETT datasets with supervised PatchTST/64 and PatchTST/42
      against baselines cited from the DLinear paper. Univariate: the target feature oil temperature is
      forecast (line 567). MSE and MAE, lower is better; T in {96, 192, 336, 720}. Variant labels as in
      Table 3: PatchTST/64 (L=512), PatchTST/42 (L=336). Data split: the long-term forecasting convention
      of prior Transformer work (Autoformer setting). Metrics: MSE, MAE.
    note: >-
      Split convention inferred from the experimental setup stated in Section 4.1 (line 128). Compared with
      the DLinear paper's Table 5: FEDformer equals FEDformer-f; DLinear on ETTh1 at T=720 is 0.189/0.359
      here but 0.119/0.274 there; LogTrans MAE on ETTh1 at T=720 is 0.629 here but 0.628 there.
    FROM:
    - to: $paper
      locators:
      - A.3 Univariate Forecasting::569:588
      - 4.1 Long-term Time series forecasting::128:128
    EVALUATES:
    - to: $patchtst
      role: target
      description: 'Variants as printed: PatchTST/64, PatchTST/42. Run by the authors of this paper.'
    - to: method_0027   # DLinear
      role: baseline
      description: Results taken from "Are Transformers Effective for Time Series Forecasting?".
      source_refs: ['$paper::A.3 Univariate Forecasting::567:567']
    - to: method_0029   # FEDformer
      role: baseline
      description: Results taken from "Are Transformers Effective for Time Series Forecasting?".
      source_refs: ['$paper::A.3 Univariate Forecasting::567:567']
    - to: method_0030   # Autoformer
      role: baseline
      description: Results taken from "Are Transformers Effective for Time Series Forecasting?".
      source_refs: ['$paper::A.3 Univariate Forecasting::567:567']
    - to: method_0031   # Informer
      role: baseline
      description: Results taken from "Are Transformers Effective for Time Series Forecasting?".
      source_refs: ['$paper::A.3 Univariate Forecasting::567:567']
    - to: method_0033   # LogTrans
      role: baseline
      description: Results taken from "Are Transformers Effective for Time Series Forecasting?".
      source_refs: ['$paper::A.3 Univariate Forecasting::567:567']
    USES:
    - to: dataset_0002   # ETTh1
      role: evaluation_data
    - to: dataset_0003   # ETTh2
      role: evaluation_data
    - to: dataset_0004   # ETTm1
      role: evaluation_data
    - to: dataset_0005   # ETTm2
      role: evaluation_data
    ON_TASK: [task_0002]   # Long-term time series forecasting

  # A1.T9：A.4.2 Varying Look-back Window，第 606–641 行
  $x_t9:
    kind: Experiment
    anchors: [A1.T9]
    text: >-
      Supervised PatchTST/42 with look-back windows from 24 to 720 on eight datasets. Multivariate; MSE
      and MAE, lower is better. Columns are look-back windows L in {24, 48, 96, 192, 336, 720}; the values
      in parentheses, {24, 36, 48, 60, 104, 144}, are the look-back windows used for ILI. T in {96, 192,
      336, 720}, and {24, 36, 48, 60} for ILI. Data split: the long-term forecasting convention of prior
      Transformer work (Autoformer setting). Metrics: MSE, MAE.
    note: >-
      Split convention inferred from the experimental setup stated in Section 4.1 (line 128).
    FROM:
    - to: $paper
      locators:
      - A.4.2 Varying Look-back Window::606:641
      - 4.1 Long-term Time series forecasting::128:128
    EVALUATES:
    - to: $patchtst
      role: target
      description: 'Variants as printed: PatchTST/42. Run by the authors of this paper.'
    USES:
    - to: dataset_0008   # Weather
      role: evaluation_data
    - to: dataset_0007   # Traffic
      role: evaluation_data
    - to: dataset_0006   # Electricity
      role: evaluation_data
    - to: dataset_0009   # ILI
      role: evaluation_data
    - to: dataset_0002   # ETTh1
      role: evaluation_data
    - to: dataset_0003   # ETTh2
      role: evaluation_data
    - to: dataset_0004   # ETTm1
      role: evaluation_data
    - to: dataset_0005   # ETTm2
      role: evaluation_data
    ON_TASK: [task_0002]   # Long-term time series forecasting

  # A1.T10：A.4.3 Patching and Channel-independence，第 662–698 行
  $x_t10:
    kind: Experiment
    anchors: [A1.T10]
    text: >-
      Full benchmark of the patching and channel-independence ablation of PatchTST/42 on eight datasets,
      with FEDformer as reference. Multivariate; MSE and MAE, lower is better; T in {96, 192, 336, 720}.
      Variant labels as printed (A.4.3, lines 649-655): P+CI (patching and channel independence: the full
      PatchTST/42), CI (channel independence only: patch length and stride set to 1), P (patching with channel
      mixing), Original (neither: the original TST model of Zerveas et al., 2021). '-' marks runs out of
      memory on an NVIDIA A40 48GB. For the ablation, the maximum number of epochs on Electricity and Traffic
      is reduced from 100 to 20 (line 657). Data split: the long-term forecasting convention of prior Transformer
      work (Autoformer setting). Metrics: MSE, MAE.
    note: >-
      Split convention inferred from the experimental setup stated in Section 4.1 (line 128). Extends Table
      7. FEDformer values equal Table 3; the table does not restate their source.
    FROM:
    - to: $paper
      locators:
      - A.4.3 Patching and Channel-independence::662:698
      - 4.1 Long-term Time series forecasting::128:128
    EVALUATES:
    - to: $patchtst
      role: target
      description: 'Variants as printed: P+CI, CI, P, Original. Run by the authors of this paper.'
    - to: method_0029   # FEDformer
      role: baseline
      description: The paper does not state where these results come from.
    USES:
    - to: dataset_0008   # Weather
      role: evaluation_data
    - to: dataset_0007   # Traffic
      role: evaluation_data
    - to: dataset_0006   # Electricity
      role: evaluation_data
    - to: dataset_0009   # ILI
      role: evaluation_data
    - to: dataset_0002   # ETTh1
      role: evaluation_data
    - to: dataset_0003   # ETTh2
      role: evaluation_data
    - to: dataset_0004   # ETTm1
      role: evaluation_data
    - to: dataset_0005   # ETTm2
      role: evaluation_data
    ON_TASK: [task_0002]   # Long-term time series forecasting

  # A1.T11：A.4.4 Instance Normalization，第 705–740 行
  $x_t11:
    kind: Experiment
    anchors: [A1.T11]
    text: >-
      Effect of instance normalization on supervised PatchTST/64 and PatchTST/42 on eight datasets, with
      FEDformer, Autoformer and Informer as reference. Multivariate; MSE and MAE, lower is better; T as
      in Table 3. Variant labels as printed: +in with instance normalization (the default), -in without;
      PatchTST/64 uses L=512 and PatchTST/42 uses L=336. Data split: the long-term forecasting convention
      of prior Transformer work (Autoformer setting). Metrics: MSE, MAE.
    note: >-
      Split convention inferred from the experimental setup stated in Section 4.1 (line 128). The +in columns
      and the baseline columns equal Table 3; the table does not restate the baselines' source.
    FROM:
    - to: $paper
      locators:
      - A.4.4 Instance Normalization::705:740
      - 4.1 Long-term Time series forecasting::128:128
    EVALUATES:
    - to: $patchtst
