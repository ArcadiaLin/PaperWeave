  - ref: x_t14
    anchor: A1.T14
    section: "A.6.1 Results with Different Random Seeds"
    lines: [829, 860]
    task: ltsf
    text: >
      Mean and standard deviation over five runs for supervised and self-supervised PatchTST/42
      on seven datasets.
