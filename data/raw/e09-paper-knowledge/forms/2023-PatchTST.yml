    participants:
      - {subject: patchtst,   role: target,   variants: [PatchTST/64 (+in), PatchTST/64 (-in), PatchTST/42 (+in), PatchTST/42 (-in)], origin: own}
      - {subject: fedformer,  role: baseline, origin: unstated}
