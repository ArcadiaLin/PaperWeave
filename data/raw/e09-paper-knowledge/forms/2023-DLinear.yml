# 正式入库表单 paper-form-v2（报告级）：2023-DLinear 全部报告结果的表（表 2–9；表 1 是数据集统计，不录）。
# 抽取者：Claude（人工样例与参考结果，2026-10-03）。写法见 docs/designs/v2/extraction_principles.md 与 commit_contract.md。
# 报告级只记录实验在哪张表、比了谁、在哪些数据集与指标上、实验级条件；数值留在原文，比较时按锚点读取。
# 行号指 papers/2023-DLinear/paper.md。

form: paper-form-v2
domain: ltsf
material: {path: papers/2023-DLinear/paper.md, sha256: 1ec346c934e6ebac616e861bd0fa46fcb56157bd0a8ed7190be29dffa3ee1065}
x-ingest: {committed_by: claude, rounds: 2}   # 否定判定沿用上一版表单（b459504）第 1 轮的结果；本版另有一次因向量服务瞬时故障重跑，不计入

paper:
  labels: [Entity, Paper]
  properties:
    name: "Are Transformers Effective for Time Series Forecasting?"
    identifiers: ["arxiv:2205.13504"]
    description: >
      Questions whether Transformer-based models are effective for long-term time series
      forecasting and introduces DLinear, a decomposition plus one-layer linear model, which
      outperforms Transformer-based methods on nine real-life datasets in most cases.

refs:
  ltsf:      {mention: LTSF, kind: Task}
  etth1:     {mention: ETTh1, kind: Dataset}
  etth2:     {mention: ETTh2, kind: Dataset}
  ettm1:     {mention: ETTm1, kind: Dataset}
  ettm2:     {mention: ETTm2, kind: Dataset}
  elec:      {mention: Electricity, kind: Dataset}
  elec_typo: {id: dataset_0006, printed: Eletricity}   # 表 4 印作 "Eletricity"（笔误）：按 id 绑定，不注册为 alias
  exch_rate: {mention: Exchange-Rate, kind: Dataset}
  exch:      {mention: Exchange, kind: Dataset}         # 表 4 的印法
  traffic:   {mention: Traffic, kind: Dataset}
  weather:   {mention: Weather, kind: Dataset}
  ili:       {mention: ILI, kind: Dataset}
  mse:       {mention: MSE, kind: Metric}
  mae:       {mention: MAE, kind: Metric}

objects:
  # 本文核心方法：做到本文自身的深度
  dlinear:
    labels: [Concept, Method]
    properties:
      name: DLinear
      definition: >
        A linear forecasting model that decomposes the input series into a trend component
        (moving average) and a remainder (seasonal) component, applies a one-layer linear
        mapping to each along the time axis, and sums the two outputs as the forecast.
    rejected: [method_0008, method_0007, method_0002, method_0004, method_0010]   # dry_run 第 1 轮的近邻，判定均不是同一对象
  # 本文定义的朴素基线：定义完全出自本文（第 146 行），不是桩
  repeat_c:
    labels: [Concept, Method]
    properties:
      name: Repeat-C
      aliases: [Closest Repeat]
      definition: >
        A naive direct multi-step baseline that repeats the last value of the look-back window
        as the forecast for every future step.
    rejected: [method_0010, method_0003, method_0001, method_0002, method_0008]   # dry_run 第 1 轮的近邻，判定均不是同一对象
  # 基线：桩节点。只有名称与引用线索；定义与方法间关系留空，等其原论文入库时补全
  fedformer:
    labels: [Concept, Method]
    stub: true
    properties: {name: FEDformer, note: "Cited as [29] Zhou et al., Fedformer: Frequency enhanced decomposed transformer for long-term series forecasting. ICML 2022."}
    rejected: []
  autoformer:
    labels: [Concept, Method]
    stub: true
    properties: {name: Autoformer, note: "Cited as [27] Xu, Wang, Long et al., Autoformer: Decomposition transformers with auto-correlation for long-term series forecasting. NeurIPS 2021."}
    rejected: []
  informer:
    labels: [Concept, Method]
    stub: true
    properties: {name: Informer, note: "Cited as [28] Zhou et al., Informer: Beyond efficient transformer for long sequence time-series forecasting."}
    rejected: []
  pyraformer:
    labels: [Concept, Method]
    stub: true
    properties: {name: Pyraformer, note: "Cited as [18] Liu et al., Pyraformer: Low-complexity pyramidal attention for long-range time series modeling and forecasting."}
    rejected: []
  logtrans:
    labels: [Concept, Method]
    stub: true
    properties: {name: LogTrans, note: "Cited as [16] Li et al., Enhancing the locality and breaking the memory bottleneck of transformer on time series forecasting."}
    rejected: []
  reformer:
    labels: [Concept, Method]
    stub: true
    properties: {name: Reformer, note: "Cited as [14] Kitaev, Kaiser and Levskaya, Reformer: The efficient transformer. ICLR 2019."}
    rejected: []
  transformer:
    labels: [Concept, Method]
    stub: true
    properties: {name: Transformer, note: "The vanilla Transformer, cited as [25] Vaswani et al., Attention is all you need. NeurIPS 2017."}
    rejected: [method_0004]   # dry_run 第 1 轮的近邻，判定均不是同一对象
  # 被引论文：桩节点（单篇深度），只建本文转引了结果或沿用了实验设置的论文（extraction_principles.md §7）
  fedformer_paper:
    labels: [Entity, Paper]
    stub: true
    properties: {name: "Fedformer: Frequency enhanced decomposed transformer for long-term series forecasting", note: "Cited as [29] Tian Zhou, Ziqing Ma, Qingsong Wen, Xue Wang, Liang Sun, and Rong Jin. In International Conference on Machine Learning, 2022."}
    rejected: []
  autoformer_paper:
    labels: [Entity, Paper]
    stub: true
    properties: {name: "Autoformer: Decomposition transformers with auto-correlation for long-term series forecasting", note: "Cited as [27] Jiehui Xu, Jianmin Wang, Mingsheng Long, et al. Advances in Neural Information Processing Systems, 34, 2021."}
    rejected: []
  # 表 8 的效率指标：通用概念，定义不依赖本文
  macs:
    labels: [Concept, Metric]
    properties:
      name: MACs
      aliases: [multiply-accumulate operations]
      direction: lower
      definition: >
        Number of multiply-accumulate operations in one forward pass of a model; a
        hardware-independent measure of computational cost.
    rejected: [metric_0002, metric_0003, metric_0006, metric_0004, metric_0005]   # dry_run 第 1 轮的近邻，判定均不是同一对象
  params:
    labels: [Concept, Metric]
    properties:
      name: Parameter count
      aliases: [Parameter, number of parameters]
      direction: lower
      definition: Number of trainable parameters of a model.
    rejected: [metric_0005, metric_0004, metric_0002, metric_0006, metric_0003]   # dry_run 第 1 轮的近邻，判定均不是同一对象
  inference_time:
    labels: [Concept, Metric]
    properties:
      name: Inference time
      direction: lower
      definition: >
        Wall-clock time a trained model takes to produce a forecast; depends on hardware,
        batch size and implementation.
    rejected: [metric_0001, metric_0004, metric_0002, metric_0003, metric_0005]   # dry_run 第 1 轮的近邻，判定均不是同一对象
  memory:
    labels: [Concept, Metric]
    properties:
      name: Memory usage
      aliases: [Memory]
      direction: lower
      definition: >
        Device memory consumed while running a model; depends on hardware, batch size and
        implementation.
    rejected: [metric_0005, metric_0002, metric_0004, metric_0010, metric_0001]   # dry_run 第 1 轮的近邻，判定均不是同一对象

# 只写本文到被引论文的 CITES，选择性写入：转引了结果的必写，沿用实验设置等对实验有实际作用的可写；
# 方法间关系不在单篇抽取中包办
relationships:
  - from: paper
    type: CITES
    to: fedformer_paper
    basis: ["References::651:655", "5.1 Experimental Settings::172:172", "5.1 Experimental Settings::196:196"]
    description: >
      Results of FEDformer, Autoformer, Informer, LogTrans and Reformer in Tables 2 and 3 are
      taken from this paper.
  - from: paper
    type: CITES
    to: autoformer_paper
    basis: ["References::638:642", "5.2 Comparison of Multivariate Forecasting with Transformers::203:203", "A.2 Implementation Details::461:461"]
    description: >
      The experimental setting of Tables 2 and 3 follows this paper (together with [28] and [29]);
      the Autoformer, Informer and vanilla Transformer implementations are taken from its code.

x-split-203: &split203 {split: "5.2 Comparison of Multivariate Forecasting with Transformers::203:203"}   # "following the experimental setting of previous work [27, 29, 28]"

experiments:
  - ref: x_t2
    anchor: S5.T2
    section: "5.1 Experimental Settings"
    lines: [148, 172]
    task: ltsf
    text: >
      Multivariate long-term forecasting on Electricity, Exchange-Rate, Traffic, Weather and ILI
      comparing DLinear with six Transformer-based methods and the naive Repeat-C baseline under
      the look-back window used by prior Transformer work.
    setting: >
      Multivariate; MSE and MAE, lower is better. Look-back window L=96 and horizon
      T in {96, 192, 336, 720} for Electricity, Exchange-Rate, Traffic and Weather; L=36 and
      T in {24, 36, 48, 60} for ILI. Variant labels as printed: DLinear-S shares one linear layer
      across all variates (the paper's default); DLinear-I uses an individual linear layer per
      variate. FEDformer here is FEDformer-f, the Fourier variant (line 146). Rows marked *
      (DLinear-S, DLinear-I, Pyraformer, Repeat-C) were run by the authors; the other rows are
      taken from the FEDformer paper (line 172).
    note: >
      The caption says "four datasets are with L=96" although five datasets are shown; with
      line 247 ("In Table 2 ... fix the look-back window size as 96") it reads as L=96 for the
      four non-ILI datasets and L=36 for ILI.
    participants:
      - {subject: dlinear,    role: target,   variants: [DLinear-S, DLinear-I], origin: own}
      - {subject: fedformer,  role: baseline, origin: {kind: cited, basis: "5.1 Experimental Settings::172:172", from: fedformer_paper}}
      - {subject: autoformer, role: baseline, origin: {kind: cited, basis: "5.1 Experimental Settings::172:172", from: fedformer_paper}}
      - {subject: informer,   role: baseline, origin: {kind: cited, basis: "5.1 Experimental Settings::172:172", from: fedformer_paper}}
      - {subject: pyraformer, role: baseline, origin: {kind: rerun, basis: "5.1 Experimental Settings::172:172"}}
      - {subject: logtrans,   role: baseline, origin: {kind: cited, basis: "5.1 Experimental Settings::172:172", from: fedformer_paper}}
      - {subject: reformer,   role: baseline, origin: {kind: cited, basis: "5.1 Experimental Settings::172:172", from: fedformer_paper}}
      - {subject: repeat_c,   role: baseline, origin: {kind: rerun, basis: "5.1 Experimental Settings::172:172"}}
    data: [elec, exch_rate, traffic, weather, ili]
    metrics: [mse, mae]
    conditions: {split: "convention:ltsf-autoformer"}
    condition_basis: *split203

  - ref: x_t3
    anchor: S5.T3
    section: "5.1 Experimental Settings"
    lines: [174, 196]
    task: ltsf
    text: >
      Multivariate long-term forecasting on the four ETT datasets comparing DLinear-S with six
      Transformer-based methods under the look-back window used by prior Transformer work.
    setting: >
      Multivariate; MSE and MAE, lower is better. L=96, T in {96, 192, 336, 720}. Only DLinear-S
      (shared linear layer) is reported. FEDformer is FEDformer-f (line 146). Rows marked *
      (DLinear-S, Pyraformer) were run by the authors; the other rows are taken from the
      FEDformer paper (line 196).
    note: >
      FEDformer MAE on ETTh2 at T=720 is printed as "0474" (decimal point missing, presumably 0.474).
    participants:
      - {subject: dlinear,    role: target,   variants: [DLinear-S], origin: own}
      - {subject: fedformer,  role: baseline, origin: {kind: cited, basis: "5.1 Experimental Settings::196:196", from: fedformer_paper}}
      - {subject: autoformer, role: baseline, origin: {kind: cited, basis: "5.1 Experimental Settings::196:196", from: fedformer_paper}}
      - {subject: informer,   role: baseline, origin: {kind: cited, basis: "5.1 Experimental Settings::196:196", from: fedformer_paper}}
      - {subject: pyraformer, role: baseline, origin: {kind: rerun, basis: "5.1 Experimental Settings::196:196"}}
      - {subject: logtrans,   role: baseline, origin: {kind: cited, basis: "5.1 Experimental Settings::196:196", from: fedformer_paper}}
      - {subject: reformer,   role: baseline, origin: {kind: cited, basis: "5.1 Experimental Settings::196:196", from: fedformer_paper}}
    data: [etth1, etth2, ettm1, ettm2]
    metrics: [mse, mae]
    conditions: {split: "convention:ltsf-autoformer"}
    condition_basis: *split203

  - ref: x_t4
    anchor: S5.T4
    section: "5.3 Comparison under a Large Look-Back Window Size"
    lines: [251, 290]
    task: ltsf
    text: >
      Multivariate long-term forecasting on nine benchmarks comparing DLinear with a long
      look-back window against FEDformer and Autoformer kept at their best setting.
    setting: >
      Multivariate; MSE and MAE, lower is better. Look-back window L=336 for DLinear;
      FEDformer and Autoformer keep L=96, their best setting. Forecasting horizon
      T in {96, 192, 336, 720}. Variant labels as printed: DLinear-S shares one linear layer
      across all variates (the paper's default); DLinear-I uses an individual linear layer per
      variate; FEDformer-f / FEDformer-w are FEDformer with Fourier / wavelet enhanced blocks.
    note: >
      Split convention inferred from the statement at line 203, which is made for Tables 2 and 3.
      FEDformer-f and Autoformer values on the eight non-ILI datasets equal those of Tables 2 and 3
      (taken from the FEDformer paper); the source of the FEDformer-w values is not stated.
      ILI rows are printed with horizons 96-720, implausible for ILI (966 time steps) with L=336.
      The FEDformer-f and Autoformer values on ILI equal Table 2's ILI values at horizons 24-60,
      so the horizon labels are likely misprinted and those baseline values likely reused from Table 2.
    participants:
      - {subject: dlinear,    role: target,   variants: [DLinear-S, DLinear-I], origin: own}
      - {subject: fedformer,  role: baseline, variants: [FEDformer-f, FEDformer-w], origin: unstated}
      - {subject: autoformer, role: baseline, origin: unstated}
    data: [etth1, etth2, ettm1, ettm2, elec_typo, exch, traffic, weather, ili]
    metrics: [mse, mae]
    conditions: {split: "convention:ltsf-autoformer"}
    condition_basis: *split203

  - ref: x_t5
    anchor: S5.T5
    section: "5.3 Comparison under a Large Look-Back Window Size"
    lines: [295, 314]
    task: ltsf
    text: >
      Univariate long-term forecasting on the four ETT datasets comparing DLinear with a long
      look-back window against Transformer-based methods.
    setting: >
      Univariate; MSE and MAE, lower is better. L=336 for DLinear; FEDformer and Autoformer keep
      L=96, their best setting; the look-back window of Informer, LogTrans and Reformer is not
      stated. T in {96, 192, 336, 720}. DLinear stands for both DLinear-S and DLinear-I, which
      coincide for univariate forecasting (line 293). FEDformer-f / FEDformer-w are FEDformer
      with Fourier / wavelet enhanced blocks.
    note: >
      Split convention inferred from the statement at line 203, which is made for Tables 2 and 3.
      The caption says "ETT full benchmark" while the rows are ETTh1, ETTh2, ETTm1 and ETTm2,
      the names of the ETT-small part. The sentence introducing this table (line 293) refers to
      Table 4 although it describes this table.
    participants:
      - {subject: dlinear,    role: target,   origin: own}
      - {subject: fedformer,  role: baseline, variants: [FEDformer-f, FEDformer-w], origin: unstated}
      - {subject: autoformer, role: baseline, origin: unstated}
      - {subject: informer,   role: baseline, origin: unstated}
      - {subject: logtrans,   role: baseline, origin: unstated}
      - {subject: reformer,   role: baseline, origin: unstated}
    data: [etth1, etth2, ettm1, ettm2]
    metrics: [mse, mae]
    conditions: {split: "convention:ltsf-autoformer"}
    condition_basis: *split203

  - ref: x_t6
    anchor: S5.T6
    section: "5.4 More Analyses on Transformer-Based Solutions"
    lines: [345, 360]
    task: ltsf
    text: >
      Effect of positional and timestamp embeddings on FEDformer, Autoformer and Informer for
      multivariate forecasting on Electricity and Traffic.
    setting: >
      Multivariate; MSE only, lower is better. L=96, T in {96, 192, 336, 720}. Embedding labels
      as printed: All (all embeddings), wo/Pos. (without the fixed positional embedding),
      wo/Temp. (without the timestamp embedding), wo/Pos.-Temp. (without both).
    note: >
      Split convention inferred from the statement at line 203, which is made for Tables 2 and 3.
      Several rows equal Table 2 entries taken from the FEDformer paper: FEDformer wo/Pos.,
      Autoformer wo/Pos. on Traffic, and Informer All. Autoformer wo/Pos. on Electricity
      (0.193, 0.201, 0.214, 0.246) is identical to FEDformer wo/Pos., likely a copy error.
    participants:
      - {subject: fedformer,  role: target, variants: [All, wo/Pos., wo/Temp., wo/Pos.-Temp.], origin: unstated}
      - {subject: autoformer, role: target, variants: [All, wo/Pos., wo/Temp., wo/Pos.-Temp.], origin: unstated}
      - {subject: informer,   role: target, variants: [All, wo/Pos., wo/Temp., wo/Pos.-Temp.], origin: unstated}
    data: [elec, traffic]
    metrics: [mse]
    conditions: {split: "convention:ltsf-autoformer"}
    condition_basis: *split203

  - ref: x_t7
    anchor: S5.T7
    section: "5.4 More Analyses on Transformer-Based Solutions"
    lines: [362, 373]   # 表在 362–369；数据集只在随后的第 371–373 行说明
    task: ltsf
    text: >
      Effect of training data size: DLinear, FEDformer and Autoformer trained on the full
      Traffic training set versus a shortened one-year training set.
    setting: >
      Traffic; MSE only, lower is better. Rows are horizons T in {96, 192, 336, 720}. Ori. trains
      on the full training set (17,544*0.7 hours); Short trains on 8,760 hours, i.e. one year
      (line 373). The look-back window is not stated.
    note: >
      The dataset is named only in the text (line 373), not in the table, whose header cell
      "Dataset" labels the horizon column. The Ori. values of DLinear, FEDformer and Autoformer
      equal their Traffic MSE in Table 2 (L=96).
    participants:
      - {subject: dlinear,    role: target,   origin: own}
      - {subject: fedformer,  role: baseline, origin: unstated}
      - {subject: autoformer, role: baseline, origin: unstated}
    data: [traffic]
    metrics: [mse]
    conditions: {split: null}   # Short 改了训练集，不套用切分约定

  - ref: x_t8
    anchor: S5.T8
    section: "5.4 More Analyses on Transformer-Based Solutions"
    lines: [378, 391]
    task: ltsf
    text: >
      Efficiency of DLinear and Transformer-based methods on Electricity: computation,
      parameters, inference time and memory, with theoretical complexity.
    setting: >
      Electricity; L=96, T=720; measured on one NVIDIA Titan Xp (line 376); inference time is the
      average of 5 runs. The table also lists theoretical time and memory complexity and the
      number of test steps. Transformer× is the vanilla Transformer modified into the same
      one-step decoder, implemented from the Autoformer code. 236.7M of Pyraformer's parameters
      come from its linear decoder.
    note: >
      The columns Time and Memory appear twice: first the measured values, then the theoretical
      complexity.
    participants:
      - {subject: dlinear,     role: target,   origin: own}
      - {subject: transformer, role: baseline, origin: {kind: rerun, basis: "5.4 More Analyses on Transformer-Based Solutions::376:376"}}
      - {subject: informer,    role: baseline, origin: {kind: rerun, basis: "5.4 More Analyses on Transformer-Based Solutions::376:376"}}
      - {subject: autoformer,  role: baseline, origin: {kind: rerun, basis: "5.4 More Analyses on Transformer-Based Solutions::376:376"}}
      - {subject: pyraformer,  role: baseline, origin: {kind: rerun, basis: "5.4 More Analyses on Transformer-Based Solutions::376:376"}}
      - {subject: fedformer,   role: baseline, origin: {kind: rerun, basis: "5.4 More Analyses on Transformer-Based Solutions::376:376"}}
    data: [elec]
    metrics: [macs, params, inference_time, memory]
    conditions: {split: null}

  - ref: x_t9
    anchor: S5.T9
    section: "5.5 Ablation study on the DLinear"
    lines: [403, 410]
    task: ltsf
    text: >
      Ablation of the decomposition in DLinear: DLinear versus a single linear layer without
      decomposition on nine datasets.
    setting: >
      Multivariate; MSE only, lower is better. L=36 for ILI and L=96 for the others;
      T in {96, 192, 336, 720}, and {24, 36, 48, 60} for ILI. Variant labels as printed: DLinear
      (with decomposition); wo/D. removes the decomposition, leaving one linear layer.
    note: >
      Split convention inferred from the statement at line 203, which is made for Tables 2 and 3.
      DLinear values equal DLinear-S in Tables 2 and 3 except ILI at T=36 (2.642 here, 2.646 in Table 2).
    participants:
      - {subject: dlinear, role: target, variants: [DLinear, wo/D.], origin: own}
    data: [etth1, etth2, ettm1, ettm2, exch_rate, elec, traffic, weather, ili]
    metrics: [mse]
    conditions: {split: "convention:ltsf-autoformer"}
    condition_basis: *split203
