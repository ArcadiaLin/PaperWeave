# 种子概念：时序预测主线（2023-DLinear、2023-PatchTST）
# 格式与约定见同目录 README.md。节点内容一律使用英文。
# sources / verified 位于 properties 之外，只记入种子增量，不写进图。

nodes:
  # ---------- Concept.Task ----------
  - ref: task_tsf
    labels: [Concept, Task]
    properties:
      name: Time series forecasting
      aliases: [TSF, time-series forecasting]
      definition: >
        Given a window of past observations (the look-back window, length L), predict the
        values of the next T time steps. Series may be univariate or multivariate; evaluation
        compares forecasts with ground truth over the forecast horizon.

  - ref: task_ltsf
    labels: [Concept, Task]
    properties:
      name: Long-term time series forecasting
      aliases: [LTSF, long sequence time-series forecasting, LSTF]
      definition: >
        Time series forecasting with a long forecast horizon (T much larger than 1, typically
        tens to hundreds of steps).

  - ref: task_ts_repr
    labels: [Concept, Task]
    properties:
      name: Time series representation learning
      aliases: [time-series representation learning]
      definition: >
        Learning reusable representations from (usually unlabeled) time series, assessed by
        performance on downstream tasks such as forecasting or classification, possibly after
        transfer to other datasets.

  # ---------- Concept.Method ----------
  - ref: mc_multistep
    labels: [Concept, Method]
    properties:
      name: Multi-step forecasting strategy
      aliases: [multi-step prediction strategy]
      definition: >
        How a model produces forecasts for more than one future step. The two main families
        are iterated multi-step forecasting and direct multi-step forecasting.

  - ref: mc_ims
    labels: [Concept, Method]
    properties:
      name: Iterated multi-step forecasting
      aliases: [IMS, recursive multi-step forecasting]
      definition: >
        Train a one-step-ahead forecaster and apply it repeatedly, feeding each prediction
        back as input to produce the next step.

  - ref: mc_dms
    labels: [Concept, Method]
    properties:
      name: Direct multi-step forecasting
      aliases: [DMS, direct multi-step strategy]
      definition: >
        Optimize the multi-step forecasting objective directly and output all future steps
        without feeding predictions back as inputs.

  - ref: mc_tsf_transformer
    labels: [Concept, Method]
    properties:
      name: Transformer-based time series forecasting
      aliases: [time series Transformer, Transformer-based TSF]
      definition: >
        Forecasting models whose backbone is a Transformer (self-attention). Design choices
        vary in input embedding, attention mechanism, use of series decomposition, and how the
        multi-step output is decoded.

  - ref: mc_efficient_attention
    labels: [Concept, Method]
    properties:
      name: Efficient attention
      aliases: [efficient self-attention]
      definition: >
        Mechanisms that reduce the quadratic time and memory cost of standard self-attention
        in sequence length, e.g. sparse attention patterns, low-rank approximations,
        hierarchical structures, and frequency-domain transforms.

  - ref: mc_sparse_attention
    labels: [Concept, Method]
    properties:
      name: Sparse attention
      definition: >
        Attention in which each query attends only to a selected subset of keys, according to
        a fixed pattern or a learned or data-dependent selection, instead of all positions.

  - ref: mc_decomposition
    labels: [Concept, Method]
    properties:
      name: Seasonal-trend decomposition
      aliases: [series decomposition, trend-seasonal decomposition]
      definition: >
        Split a time series into a trend (or trend-cyclical) component and a seasonal (or
        remainder) component that are handled separately and recombined. The trend is often
        extracted with a moving average, and the remainder is the series minus the trend.
        Can be applied as preprocessing or inside a model.

  - ref: mc_linear_forecaster
    labels: [Concept, Method]
    properties:
      name: Linear forecasting model
      aliases: [linear forecaster]
      definition: >
        Models that map the look-back window to the forecast horizon with a linear
        transformation, such as a single fully connected layer.

  - ref: mc_patching
    labels: [Concept, Method]
    properties:
      name: Patching
      aliases: [patch-based tokenization]
      definition: >
        Segment a sequence into contiguous, possibly overlapping sub-sequences (patches) and
        use each patch as one input token. Splitting an image into patches as tokens follows
        the same idea.

  - ref: mc_channel_independence
    labels: [Concept, Method]
    properties:
      name: Channel independence
      aliases: [channel-independent modeling]
      definition: >
        For multivariate series, feed each variable (channel) to the same model as a separate
        univariate series with shared weights, without mixing channels at the input. The
        alternative, channel mixing, feeds the multivariate vector of each time step as one
        input.

  - ref: mc_instance_norm
    labels: [Concept, Method]
    properties:
      name: Instance normalization
      definition: >
        Normalize each input instance individually using statistics computed from that
        instance alone (e.g. to zero mean and unit variance), rather than statistics of a batch
        or of the whole dataset.

  - ref: mc_masked_pretraining
    labels: [Concept, Method]
    properties:
      name: Masked modeling self-supervised pre-training
      aliases: [masked modeling, masked autoencoding]
      definition: >
        Randomly mask part of the input (e.g. words, image patches, time steps or time-series
        patches) and train the model to reconstruct the masked content from unlabeled data; the
        pre-trained model is then fine-tuned or transferred to downstream tasks.

  # ---------- Entity ----------
  - ref: res_ett
    labels: [Entity, Dataset]
    properties:
      name: ETT
      aliases: [Electricity Transformer Temperature, ETDataset]
      identifiers: ["url:https://github.com/zhouhaoyi/ETDataset"]
      description: >
        Electricity transformer data from July 2016 to July 2018, released with Informer
        (Zhou et al., 2021). Each record has 7 variables: six power load features (HUFL, HULL,
        MUFL, MULL, LUFL, LULL) and oil temperature (OT). The commonly used ETT-small part
        contains two transformers, each at hourly (ETTh1, ETTh2) and 15-minute (ETTm1, ETTm2)
        resolution.
      note: >
        The repository also has larger ETT-large and ETT-full parts; the names ETTh1, ETTh2,
        ETTm1 and ETTm2 refer to ETT-small.
    sources:
      - https://github.com/zhouhaoyi/ETDataset
      - https://github.com/zhouhaoyi/ETDataset/tree/main/ETT-small
    verified: true

  - ref: res_etth1
    labels: [Entity, Dataset]
    properties:
      name: ETTh1
      identifiers: ["url:https://github.com/zhouhaoyi/ETDataset"]
      description: >
        Hourly data of the first transformer in ETT-small; 7 variables, 17,420 time steps
        from 2016-07-01 00:00 to 2018-06-26 19:00.
    sources: [https://raw.githubusercontent.com/zhouhaoyi/ETDataset/main/ETT-small/ETTh1.csv]
    verified: true

  - ref: res_etth2
    labels: [Entity, Dataset]
    properties:
      name: ETTh2
      identifiers: ["url:https://github.com/zhouhaoyi/ETDataset"]
      description: Hourly data of the second transformer in ETT-small; 7 variables.
    sources: [https://github.com/zhouhaoyi/ETDataset]
    verified: true

  - ref: res_ettm1
    labels: [Entity, Dataset]
    properties:
      name: ETTm1
      identifiers: ["url:https://github.com/zhouhaoyi/ETDataset"]
      description: >
        15-minute data of the first transformer in ETT-small; 7 variables, 69,680 time steps
        from 2016-07-01 00:00 to 2018-06-26 19:45.
    sources: [https://raw.githubusercontent.com/zhouhaoyi/ETDataset/main/ETT-small/ETTm1.csv]
    verified: true

  - ref: res_ettm2
    labels: [Entity, Dataset]
    properties:
      name: ETTm2
      identifiers: ["url:https://github.com/zhouhaoyi/ETDataset"]
      description: 15-minute data of the second transformer in ETT-small; 7 variables.
    sources: [https://github.com/zhouhaoyi/ETDataset]
    verified: true

  - ref: res_electricity
    labels: [Entity, Dataset]
    properties:
      name: Electricity
      aliases: [ECL, Electricity Consuming Load]
      identifiers: ["url:https://github.com/laiguokun/multivariate-time-series-data"]
      description: >
        Hourly electricity consumption of 321 clients from 2012 to 2014 (26,304 time steps),
        prepared by LSTNet (Lai et al., 2018) from the UCI ElectricityLoadDiagrams20112014
        data (370 clients recorded every 15 minutes, 2011-2014) by removing 2011 and
        aggregating to hourly values.
      note: >
        Differs from the raw UCI data (370 clients, 15-minute); results on the two versions
        are not directly comparable.
    sources:
      - https://github.com/laiguokun/multivariate-time-series-data
      - https://arxiv.org/abs/1703.07015
      - https://archive.ics.uci.edu/dataset/321/electricityloaddiagrams20112014
    verified: true

  - ref: res_traffic
    labels: [Entity, Dataset]
    properties:
      name: Traffic
      aliases: [PeMS traffic occupancy]
      identifiers: ["url:https://github.com/laiguokun/multivariate-time-series-data"]
      description: >
        Hourly road occupancy rates (between 0 and 1) measured by 862 sensors on San Francisco
        Bay Area freeways, from the California Department of Transportation (PeMS), 2015-2016,
        17,544 time steps; prepared by LSTNet (Lai et al., 2018).
      note: >
        A processed version of PeMS data; other PeMS-derived traffic datasets (different
        sensors, periods or measures) are different resources.
    sources:
      - https://arxiv.org/abs/1703.07015
      - https://github.com/laiguokun/multivariate-time-series-data
    verified: true

  - ref: res_weather
    labels: [Entity, Dataset]
    properties:
      name: Weather
      identifiers: ["url:https://www.bgc-jena.mpg.de/wetter/"]
      description: >
        21 meteorological indicators (e.g. air temperature, humidity) recorded every 10
        minutes over the year 2020 by the weather station of the Max Planck Institute for
        Biogeochemistry in Jena; the forecasting version was prepared by Autoformer
        (Wu et al., 2021).
    sources: [https://arxiv.org/abs/2106.13008]
    verified: true

  - ref: res_ili
    labels: [Entity, Dataset]
    properties:
      name: ILI
      aliases: [Influenza-like Illness, National Illness]
      identifiers: ["url:https://gis.cdc.gov/grasp/fluview/fluportaldashboard.html"]
      description: >
        Weekly influenza-like illness (ILI) surveillance data from the US Centers for Disease
        Control and Prevention, 2002-2021, describing the ratio of patients seen with ILI to
        the total number of patients; the forecasting version was prepared by Autoformer
        (Wu et al., 2021).
    sources: [https://arxiv.org/abs/2106.13008]
    verified: true

  - ref: res_exchange
    labels: [Entity, Dataset]
    properties:
      name: Exchange-Rate
      aliases: [Exchange, exchange_rate]
      identifiers: ["url:https://github.com/laiguokun/multivariate-time-series-data"]
      description: >
        Daily exchange rates of eight countries (Australia, Britain, Canada, Switzerland,
        China, Japan, New Zealand, Singapore) from 1990 to 2016, 7,588 time steps; prepared by
        LSTNet (Lai et al., 2018).
    sources:
      - https://arxiv.org/abs/1703.07015
      - https://github.com/laiguokun/multivariate-time-series-data
    verified: true

relationships:
  # Task 层级
  - {from: task_ltsf, type: BROADER, to: task_tsf}

  # Method 层级
  - {from: mc_ims, type: BROADER, to: mc_multistep}
  - {from: mc_dms, type: BROADER, to: mc_multistep}
  - {from: mc_sparse_attention, type: BROADER, to: mc_efficient_attention}

  # 数据集组成
  - {from: res_etth1, type: PART_OF, to: res_ett}
  - {from: res_etth2, type: PART_OF, to: res_ett}
  - {from: res_ettm1, type: PART_OF, to: res_ett}
  - {from: res_ettm2, type: PART_OF, to: res_ett}

  # 数据集服务的任务：ETT 随 Informer 为长序列预测发布；其余由 LSTNet / Autoformer 整理为预测基准
  - {from: res_ett, type: FOR_TASK, to: task_ltsf}
  - {from: res_electricity, type: FOR_TASK, to: task_tsf}
  - {from: res_traffic, type: FOR_TASK, to: task_tsf}
  - {from: res_exchange, type: FOR_TASK, to: task_tsf}
  - {from: res_weather, type: FOR_TASK, to: task_ltsf}
  - {from: res_ili, type: FOR_TASK, to: task_ltsf}
