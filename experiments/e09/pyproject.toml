[project]
name = "cacheplan-e09"
version = "0.1.0"
description = "E09: v2 数据模型的真实论文入库与访问算子检验"
readme = "README.md"
requires-python = ">=3.12,<3.14"

# 只声明流水线自己 import 的包；notebook 工具在根的 [dependency-groups]。
dependencies = [
    "neo4j>=5.28,<7",   # 图谱读写
    "pyyaml>=6,<7",     # 种子与入库增量
    "httpx>=0.28,<1",   # embedding 服务（vLLM 的 /v1/embeddings），Resolve 的语义阶段
    "graph-vc",         # 写入路径：变更集与版本记录
    "graph-doc",        # 写入路径：graph-doc 解析与求差
    "mcp>=1.20,<2",     # 把算子作为 MCP 工具提供给通用 Agent（e09.mcp）
]

[tool.uv.sources]
graph-vc = { workspace = true }
graph-doc = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/e09"]

# 新规范（2026-10-05 起）的代码受 ruff 约束；早期代码保持原样，改写时再纳入。
[tool.ruff]
line-length = 120
target-version = "py312"
include = [
    "src/e09/__init__.py",
    "src/e09/__main__.py",
    "src/e09/cli.py",
    "src/e09/mcp/**/*.py",
    "src/e09/workspace.py",
    "src/e09/yamlfmt.py",
    "src/e09/operators/**/*.py",
    "src/e09/commit/**/*.py",
    "src/e09/artifact/**/*.py",
    "src/e09/model/__init__.py",
    "src/e09/model/schema.py",
    "src/e09/model/refs.py",
    "src/e09/store/__init__.py",
    "src/e09/store/store.py",
    "src/e09/store/database.py",
    "src/e09/query/__init__.py",
    "src/e09/query/conditions.py",
    "src/e09/query/materials.py",
    "src/e09/query/view.py",
    "tests/**/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF"]
# 注释与文档字符串用中文，全角标点是正常写法。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["e09", "graph_doc", "graph_vc"]
