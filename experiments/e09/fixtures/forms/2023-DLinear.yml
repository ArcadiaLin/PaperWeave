# 入库表单夹具 paper-form-v2（报告级）：编译与 Commit 的检验用例，各只录一张表，不是正式入库表单。
# 报告级只记录实验在哪张表、比了谁、在哪些数据集与指标上、实验级条件；数值留在原文，比较时按锚点读取。
# 写法见 docs/designs/v2/extraction_principles.md 与 commit_contract.md。

form: paper-form-v2
domain: ltsf
material: {path: papers/2023-DLinear/paper.md, sha256: 1ec346c934e6ebac616e861bd0fa46fcb56157bd0a8ed7190be29dffa3ee1065}

paper:
  labels: [Entity, Paper]
  properties:
    name: "Are Transformers Effective for Time Series Forecasting?"
    identifiers: ["arxiv:2205.13504"]
    description: >
      Questions whether Transformer-based models are effective for long-term time series
      forecasting and introduces LTSF-Linear, a set of one-layer linear models, which outperform
      Transformer-based methods on nine real-life datasets.

refs:
  ltsf:   {mention: LTSF, kind: Task}
  etth1:  {mention: ETTh1, kind: Dataset}
  etth2:  {mention: ETTh2, kind: Dataset}
  ettm1:  {mention: ETTm1, kind: Dataset}
  ettm2:  {mention: ETTm2, kind: Dataset}
  elec:   {id: dataset_0006, printed: Eletricity}   # 原文表 4 印作 "Eletricity"（笔误）：按 id 绑定，不注册为 alias
  exch:   {mention: Exchange, kind: Dataset}
  traffic: {mention: Traffic, kind: Dataset}
  weather: {mention: Weather, kind: Dataset}
  ili:    {mention: ILI, kind: Dataset}
  mse:    {mention: MSE, kind: Metric}
  mae:    {mention: MAE, kind: Metric}

objects:
  # 本文核心方法：做到本文自身的深度
  dlinear:
    labels: [Concept, Method]
    properties:
      name: DLinear
      definition: >
        A linear forecasting model that decomposes the input series into a trend component
        (moving average) and a remainder (seasonal) component, applies a one-layer linear
        mapping to each along the time axis, and sums the two outputs as the forecast.
    rejected: [method_0008, method_0007, method_0002, method_0004, method_0010]   # dry_run 返回的语义近邻，判定均不是同一对象
  # 基线：桩节点。只有名称与引用线索；定义与方法间关系留空，等其原论文入库时补全
  fedformer:
    labels: [Concept, Method]
    stub: true
    properties: {name: FEDformer, note: "Cited as [29] Zhou et al., FEDformer: Frequency enhanced decomposed transformer for long-term series forecasting."}
    rejected: []
  autoformer:
    labels: [Concept, Method]
    stub: true
    properties: {name: Autoformer, note: "Cited as [27] Xu, Wang, Long et al., Autoformer: Decomposition transformers with auto-correlation for long-term series forecasting."}
    rejected: []

relationships: []   # 方法间关系不在单篇抽取中包办

experiments:
  - ref: x_t4
    anchor: S5.T4
    section: "5.3 Comparison under a Large Look-Back Window Size"
    lines: [251, 290]
    task: ltsf
    text: >
      Multivariate long-term forecasting on nine benchmarks comparing DLinear with a long
      look-back window against FEDformer and Autoformer kept at their best setting.
    setting: >
      Multivariate; MSE and MAE, lower is better. Look-back window L=336 for DLinear;
      FEDformer and Autoformer keep L=96, their best setting. Forecasting horizon
      T in {96, 192, 336, 720}. Variant labels as printed: DLinear-S shares one linear layer
      across all variates (the paper's default); DLinear-I uses an individual linear layer per
      variate; FEDformer-f / FEDformer-w are FEDformer with Fourier / wavelet enhanced blocks.
    note: >
      ILI rows are printed with horizons 96-720, implausible for ILI (966 time steps) with L=336.
      The FEDformer-f and Autoformer values on ILI equal Table 2's ILI values at horizons 24-60,
      so the horizon labels are likely misprinted and those baseline values likely reused from Table 2.
    participants:
      - {subject: dlinear,    role: target,   variants: [DLinear-S, DLinear-I], origin: own}
      - {subject: fedformer,  role: baseline, variants: [FEDformer-f, FEDformer-w], origin: unstated}
      - {subject: autoformer, role: baseline, origin: unstated}
    data: [etth1, etth2, ettm1, ettm2, elec, exch, traffic, weather, ili]
    metrics: [mse, mae]
    conditions: {split: "convention:ltsf-autoformer"}
    condition_basis: {split: "5.2 Comparison of Multivariate Forecasting with Transformers::203:203"}   # "following the experimental setting of previous work [27, 29, 28]"
