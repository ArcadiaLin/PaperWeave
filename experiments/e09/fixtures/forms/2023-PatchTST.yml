# 入库表单夹具 paper-form-v2（报告级）：编译与 Commit 的检验用例，各只录一张表，不是正式入库表单。
# 报告级只记录实验在哪张表、比了谁、在哪些数据集与指标上、实验级条件；数值留在原文，比较时按锚点读取。
# 写法见 docs/designs/v2/extraction_principles.md 与 commit_contract.md。

form: paper-form-v2
domain: ltsf
material: {path: papers/2023-PatchTST/paper.md, sha256: d29e296b18e44b771c88f5ca33dcb72f59a68efd52d173125efea3ea2bd21646}

paper:
  labels: [Entity, Paper]
  properties:
    name: "A Time Series is Worth 64 Words: Long-term Forecasting with Transformers"
    identifiers: ["arxiv:2211.14730"]
    description: >
      Proposes PatchTST, a Transformer for multivariate time series forecasting and
      self-supervised representation learning based on patching and channel independence.

refs:
  ltsf:      {mention: LTSF, kind: Task}
  weather:   {mention: Weather, kind: Dataset}
  traffic:   {mention: Traffic, kind: Dataset}
  elec:      {mention: Electricity, kind: Dataset}
  ili:       {mention: ILI, kind: Dataset}
  etth1:     {mention: ETTh1, kind: Dataset}
  etth2:     {mention: ETTh2, kind: Dataset}
  ettm1:     {mention: ETTm1, kind: Dataset}
  ettm2:     {mention: ETTm2, kind: Dataset}
  mse:       {mention: MSE, kind: Metric}
  mae:       {mention: MAE, kind: Metric}
  dlinear:   {mention: DLinear, kind: Method}       # 原文只写 DLinear，不注明变体
  fedformer: {mention: FEDformer, kind: Method}
  autoformer: {mention: Autoformer, kind: Method}

objects:
  patchtst:
    labels: [Concept, Method]
    properties:
      name: PatchTST
      definition: >
        A Transformer encoder for time series that splits each univariate channel into
        subseries-level patches used as input tokens, and processes channels independently
        with shared weights.
    rejected: [method_0009, method_0010, method_0004, method_0012, method_0007]   # dry_run 返回的语义近邻，判定均不是同一对象
  informer:
    labels: [Concept, Method]
    stub: true
    properties: {name: Informer, note: "Cited as (Zhou et al., 2021) [bib.bib42]."}
    rejected: []
  pyraformer:
    labels: [Concept, Method]
    stub: true
    properties: {name: Pyraformer, note: "Cited as (Liu et al., 2022) [bib.bib27]."}
    rejected: []
  logtrans:
    labels: [Concept, Method]
    stub: true
    properties: {name: LogTrans, note: "Cited as (Li et al., 2019) [bib.bib26]."}
    rejected: []

relationships: []   # 方法间关系不在单篇抽取中包办

experiments:
  - ref: x_t3
    anchor: S4.T3
    section: "4.1 Long-term Time series forecasting"
    lines: [134, 169]
    task: ltsf
    text: >
      Multivariate long-term forecasting on eight benchmarks with supervised PatchTST/64 and
      PatchTST/42 against DLinear and Transformer-based baselines.
    setting: >
      Multivariate, supervised training; MSE and MAE, lower is better. Horizon T in {24, 36, 48, 60}
      for ILI and {96, 192, 336, 720} for the others. Variant labels as printed: PatchTST/64 uses
      64 input patches (L=512), PatchTST/42 uses 42 patches (L=336); both use patch length 16 and
      stride 8. DLinear uses L=336 (L=104 on ILI). FEDformer, Autoformer and Informer were re-run
      with six look-back windows and the best result per task is reported. PatchTST's own look-back
      window on ILI is not stated.
    participants:
      - {subject: patchtst,   role: target,   variants: [PatchTST/64, PatchTST/42], origin: own}
      - {subject: dlinear,    role: baseline, origin: unstated}
      - {subject: fedformer,  role: baseline, origin: {kind: rerun, basis: "A.1.2 Details of Baseline Settings::535:535"}}
      - {subject: autoformer, role: baseline, origin: {kind: rerun, basis: "A.1.2 Details of Baseline Settings::535:535"}}
      - {subject: informer,   role: baseline, origin: {kind: rerun, basis: "A.1.2 Details of Baseline Settings::535:535"}}
      - {subject: pyraformer, role: baseline, origin: unstated}
      - {subject: logtrans,   role: baseline, origin: unstated}
    data: [weather, traffic, elec, ili, etth1, etth2, ettm1, ettm2]
    metrics: [mse, mae]
    conditions: {split: "convention:ltsf-autoformer"}
    condition_basis: {split: "4.1 Long-term Time series forecasting::128:128"}   # "following the same experimental setup ... as in the original papers"
