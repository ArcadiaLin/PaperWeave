      - {data: etth1, horizon: "96",  line: 154, values: ["0.370", "0.400", "0.375", "0.399", "0.375", "0.399", "0.376", "0.415", "0.435", "0.446", "0.941", "0.769", "0.664", "0.612", "0.878", "0.740"]}
      - {data: etth1, horizon: "192", line: 155, values: ["0.413", "0.429", "0.414", "0.421", "0.405", "0.416", "0.423", "0.446", "0.456", "0.457", "1.007", "0.786", "0.790", "0.681", "1.037", "0.824"]}
