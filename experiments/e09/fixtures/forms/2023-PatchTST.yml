# 入库表单夹具 paper-form-v4：编译与 Commit 的检验用例，只录一组实验、一条主张与一条贡献，不是正式入库表单。
# 实验按研究问题分组，只存描述、锚点与参与关系；数值、条件与变体留在原文，按锚点读取。
# 写法见 docs/designs/v2/extraction_principles.md 与 commit_contract.md。

form: paper-form-v4
material: {path: papers/2023-PatchTST/paper.md, sha256: d29e296b18e44b771c88f5ca33dcb72f59a68efd52d173125efea3ea2bd21646}

paper:
  labels: [Entity, Paper]
  properties:
    name: "A Time Series is Worth 64 Words: Long-term Forecasting with Transformers"
    identifiers: ["arxiv:2211.14730"]
    description: >
      Proposes PatchTST, a Transformer for multivariate time series forecasting and
      self-supervised representation learning based on patching and channel independence.

refs:
  ltsf:      {mention: LTSF, kind: Task}
  weather:   {mention: Weather, kind: Dataset}
  traffic:   {mention: Traffic, kind: Dataset}
  elec:      {mention: Electricity, kind: Dataset}
  ili:       {mention: ILI, kind: Dataset}
  etth1:     {mention: ETTh1, kind: Dataset}
  etth2:     {mention: ETTh2, kind: Dataset}
  ettm1:     {mention: ETTm1, kind: Dataset}
  ettm2:     {mention: ETTm2, kind: Dataset}
  dlinear:   {mention: DLinear, kind: Method}
  fedformer: {mention: FEDformer, kind: Method}
  autoformer: {mention: Autoformer, kind: Method}

objects:
  patchtst:
    labels: [Concept, Method]
    properties:
      name: PatchTST
      definition: >
        A Transformer encoder for time series that splits each univariate channel into
        subseries-level patches used as input tokens, and processes channels independently
        with shared weights.
    rejected: [method_0009, method_0010, method_0004, method_0012, method_0007]   # dry_run 返回的语义近邻，判定均不是同一对象
  informer:
    labels: [Concept, Method]
    stub: true
    properties: {name: Informer, note: "Cited as (Zhou et al., 2021) [bib.bib42]."}
    rejected: []
  pyraformer:
    labels: [Concept, Method]
    stub: true
    properties: {name: Pyraformer, note: "Cited as (Liu et al., 2022) [bib.bib27]."}
    rejected: []
  logtrans:
    labels: [Concept, Method]
    stub: true
    properties: {name: LogTrans, note: "Cited as (Li et al., 2019) [bib.bib26]."}
    rejected: []

relationships: []   # 方法间关系不在单篇抽取中包办

experiments:
  - anchors: [S4.T3]
    locators: ["4.1 Long-term Time series forecasting::128:169"]
    task: ltsf
    text: >
      Compares supervised PatchTST in two look-back configurations against DLinear and
      Transformer-based baselines on eight multivariate long-term forecasting datasets. Some
      Transformer baselines are re-run with several look-back windows and their best results are
      reported. The paper claims PatchTST outperforms all baselines overall.
    participants:
      - {subject: patchtst,   role: target}
      - {subject: dlinear,    role: baseline}
      - {subject: fedformer,  role: baseline}
      - {subject: autoformer, role: baseline}
      - {subject: informer,   role: baseline}
      - {subject: pyraformer, role: baseline}
      - {subject: logtrans,   role: baseline}
    data: [weather, traffic, elec, ili, etth1, etth2, ettm1, ettm2]

claims:
  - key: beats-baselines
    text: >
      The paper claims that supervised PatchTST outperforms all baseline methods on multivariate
      long-term forecasting, with large overall reductions in error relative to the best
      Transformer-based models.
    locators: ["4.1 Long-term Time series forecasting::132:132"]
    about: [patchtst, ltsf]
    supported_by: [S4.T3]

contributions:
  - key: patching-ci
    text: >
      The paper contributes PatchTST, whose two key designs are segmenting each channel into
      subseries-level patches as input tokens and channel-independent processing with shared
      weights.
    locators: ["1 Introduction::21:24"]
    about: [patchtst]
